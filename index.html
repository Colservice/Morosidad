<script>
/* ===================================================================
   CONFIGURACIÓN — completá estas 3 líneas con tus propios datos.

   =================================================================== */
const SUPABASE_URL = "https://vjgobneflufsqrsyopar.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_v4vIFnOjY99SquN-j7VZMg_rpYbejFP";
const APP_PASSWORD = "Colservice"; // clave compartida para entrar al panel
/* =================================================================== */

// ---------- helpers ----------
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function safeId(k){ return (k||'').toString().replace(/[^A-Za-z0-9_-]/g,'_'); }
function normName(s){ return (s||'').toString().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim(); }
function money(n){ return (n||0).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}); }
function shortDate(d){ if(!d) return '—'; const dt = d instanceof Date ? d : new Date(d); if(isNaN(dt)) return '—'; return dt.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function toggleSetItem(set,val){ if(set.has(val)) set.delete(val); else set.add(val); }

function readWorkbook(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
        resolve(rows);
      } catch(err){ reject(err); }
    };
    reader.onerror = ()=> reject(new Error('No se pudo leer el archivo'));
    reader.readAsArrayBuffer(file);
  });
}

// ---------- lectura de columnas por nombre (no por posición) ----------
// así el programa sigue funcionando aunque el orden de las columnas cambie
// entre un archivo y otro.
function normHeader(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
function findCol(headerRow, exactNames){
  const normalized = headerRow.map(h=>normHeader(h));
  for(const name of exactNames){
    const idx = normalized.indexOf(name);
    if(idx !== -1) return idx;
  }
  return -1;
}
// para "Monto": puede haber más de una columna que contenga la palabra, nos
// quedamos con la ÚLTIMA que se llame exactamente "monto" (según lo pedido).
function findLastExactCol(headerRow, name){
  const normalized = headerRow.map(h=>normHeader(h));
  let found = -1;
  normalized.forEach((h,i)=>{ if(h===name) found=i; });
  return found;
}

function parseDeudores(rows){
  if(!rows.length) throw new Error('El archivo de deudores está vacío.');
  const header = rows[0];
  const col = {
    razonSocial: findCol(header, ['razon social']),
    grupo: findCol(header, ['grupo']),
    orden: findCol(header, ['orden']),
    estado: findCol(header, ['estado']),
    gerencia: findCol(header, ['gerencia']),
    totalPagadas: findCol(header, ['total pagadas']),
    totalAdeudado: findCol(header, ['total adeudado']),
    valorImpago: findCol(header, ['valor total impago']),
    valorPrecancelable: findCol(header, ['valor total precancelable']),
  };
  const faltantes = Object.entries(col).filter(([k,v])=>v===-1).map(([k])=>k);
  if(faltantes.length) throw new Error('No encontré estas columnas en el archivo de deudores: '+faltantes.join(', ')+'. Revisá que los encabezados no hayan cambiado de nombre.');

  const clients = new Map();
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r[col.razonSocial]==null || r[col.razonSocial]==='') continue;
    const displayName = String(r[col.razonSocial]).trim();
    const key = normName(displayName);
    const contract = {
      id: (r[col.grupo]+'-'+r[col.orden]), grupo:r[col.grupo], orden:r[col.orden],
      estado:(r[col.estado]||'').toString().trim(), gerencia:(r[col.gerencia]||'').toString().trim(),
      totalPagadas:Number(r[col.totalPagadas])||0, totalAdeudado:Number(r[col.totalAdeudado])||0,
      valorTotalImpago:Number(r[col.valorImpago])||0, valorTotalPrecancelable:Number(r[col.valorPrecancelable])||0,
    };
    if(!clients.has(key)) clients.set(key,{key,displayName,contracts:[]});
    clients.get(key).contracts.push(contract);
  }
  return clients;
}

function parseRecibos(rows){
  if(!rows.length) throw new Error('El archivo de recibos está vacío.');
  const header = rows[0];
  const col = {
    nombre: findCol(header, ['nombre']),
    numeroRecibo: findCol(header, ['numero de recibo']),
    fecha: findCol(header, ['fecha']),
    estadoPago: findCol(header, ['estado de pago']),
    monto: findLastExactCol(header, 'monto'),
  };
  const faltantes = Object.entries(col).filter(([k,v])=>v===-1).map(([k])=>k);
  if(faltantes.length) throw new Error('No encontré estas columnas en el archivo de recibos: '+faltantes.join(', ')+'. Revisá que los encabezados no hayan cambiado de nombre.');

  const byClient = new Map();
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r[col.nombre]==null) continue;
    if((r[col.estadoPago]||'').toString().trim() !== 'Registrado') continue;
    const key = normName(r[col.nombre]);
    const fechaVal = r[col.fecha];
    const payment = { fecha: fechaVal instanceof Date ? fechaVal : (fechaVal? new Date(fechaVal):null), numeroRecibo:r[col.numeroRecibo]||'', monto:Number(r[col.monto])||0 };
    if(!byClient.has(key)) byClient.set(key,[]);
    byClient.get(key).push(payment);
  }
  for(const list of byClient.values()) list.sort((a,b)=> (b.fecha?b.fecha.getTime():0)-(a.fecha?a.fecha.getTime():0));
  return byClient;
}

function buildClients(deudoresMap, paymentsByClientMap){
  const out=[];
  for(const c of deudoresMap.values()){
    const payments = paymentsByClientMap.get(c.key) || [];
    out.push(Object.assign({}, c, {payments}));
  }
  return out;
}

// convierte los pagos "Registrado" de un archivo RECIBOS en filas listas para
// guardar de forma acumulativa (no se pierden al subir un archivo distinto)
function buildPaymentRecords(recibosMap){
  const out = [];
  for(const [key, list] of recibosMap.entries()){
    for(const p of list){
      const fechaStr = p.fecha ? p.fecha.toISOString().slice(0,10) : null;
      const numero = (p.numeroRecibo!=null && p.numeroRecibo!=='') ? String(p.numeroRecibo) : null;
      const idPart = numero || ((fechaStr||'sinfecha')+'-'+p.monto);
      out.push({ id: key+'::'+idPart, client_key:key, fecha: fechaStr, numero_recibo: numero, monto: p.monto });
    }
  }
  return out;
}

function snapshotFromClients(clients, date){
  const byClient = {};
  for(const c of clients){
    const contracts = {};
    for(const ct of c.contracts){
      contracts[ct.id] = {estado:ct.estado, gerencia:ct.gerencia, totalPagadas:ct.totalPagadas, totalAdeudado:ct.totalAdeudado, valorTotalImpago:ct.valorTotalImpago, valorTotalPrecancelable:ct.valorTotalPrecancelable};
    }
    byClient[c.key] = { displayName:c.displayName, contracts };
  }
  return {date, clients:byClient};
}

function clientsFromSnapshot(snap){
  return Object.entries(snap.clients).map(([key,c])=>{
    const contracts = Object.entries(c.contracts).map(([id,ct])=>{
      const idx = id.indexOf('-'); const grupo = id.slice(0,idx); const orden = id.slice(idx+1);
      return Object.assign({id, grupo, orden}, ct);
    });
    return {key, displayName:c.displayName, contracts, payments:[]};
  });
}

function aggregateSnapshotFiltered(snap, estadoFilter, gerenciaFilter){
  let impago=0, precancelable=0, adeudado=0, contratos=0, clientesEnMora=0, clientesCount=0;
  for(const c of Object.values(snap.clients)){
    let clienteImpago=0, tieneAlguno=false;
    for(const ct of Object.values(c.contracts)){
      if(!estadoFilter.has(ct.estado) || !gerenciaFilter.has(ct.gerencia)) continue;
      impago += ct.valorTotalImpago; precancelable += ct.valorTotalPrecancelable; adeudado += ct.totalAdeudado; contratos += 1;
      clienteImpago += ct.valorTotalImpago; tieneAlguno = true;
    }
    if(tieneAlguno) clientesCount += 1;
    if(clienteImpago>0) clientesEnMora += 1;
  }
  return {date:snap.date, impago, precancelable, adeudado, contratos, clientesEnMora, clientes:clientesCount};
}

// ---------- Supabase ----------
let sb = null;
function configLooksValid(){
  return SUPABASE_URL && !SUPABASE_URL.includes('PEGA_AQUI') && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('PEGA_AQUI');
}
async function listSnapshotDates(){
  const {data, error} = await sb.from('snapshots').select('date').order('date',{ascending:true});
  if(error) throw error;
  return (data||[]).map(r=>r.date);
}
async function getSnapshot(date){
  const {data, error} = await sb.from('snapshots').select('data').eq('date', date).maybeSingle();
  if(error) throw error;
  return data ? data.data : null;
}
async function saveSnapshot(date, snap){
  const {error} = await sb.from('snapshots').upsert({date, data:snap});
  if(error) throw error;
}

// guarda los pagos "Registrado" de forma acumulativa: subir el mismo recibo
// dos veces no duplica nada (se pisa por id), así que es seguro re-subir
// el mismo archivo o solapar meses.
async function upsertPayments(records){
  if(!records.length) return;
  const chunkSize = 500;
  for(let i=0;i<records.length;i+=chunkSize){
    const chunk = records.slice(i,i+chunkSize);
    const {error} = await sb.from('payments').upsert(chunk, {onConflict:'id'});
    if(error) throw error;
  }
}
// trae, para cada cliente, los últimos 3 pagos considerando TODO lo acumulado
// hasta ahora (no solo el último archivo subido)
async function fetchPaymentsByClient(){
  const {data, error} = await sb.from('payments').select('client_key,fecha,numero_recibo,monto').order('fecha',{ascending:false}).limit(5000);
  if(error) throw error;
  const map = new Map();
  for(const p of (data||[])){
    if(!map.has(p.client_key)) map.set(p.client_key, []);
    const arr = map.get(p.client_key);
    if(arr.length<3) arr.push({fecha: p.fecha? new Date(p.fecha): null, numeroRecibo:p.numero_recibo, monto:p.monto});
  }
  return map;
}

// ---------- state ----------
const state = {
  booting:true, configOk:false, dbOk:true, authed:false,
  view:'upload',
  deudoresFile:null, recibosFile:null, cutoffDate:todayISO(),
  loading:false, error:'', notice:'',
  clients:[], prevSnapshot:null, snapshotDates:[],
  search:'', sortField:'deuda', sortDir:'desc',
  estadoFilter:new Set(), gerenciaFilter:new Set(),
  trackClientKey:'', trackHistoryRaw:[], trackLoading:false,
  generalRawSnapshots:[], generalLoading:false, generalLoaded:false,
  planCuotas:new Map(), planCuotasLoaded:false, planCuotasLoading:false,
  planCuotasFile:null, planCuotasEditGrupo:'', planCuotasEditCuotas:'',
  informeGerencia:'', informeLoaded:false,
};
let generalChart=null, trackChart=null;

function clientPrevImpago(key){
  const p = state.prevSnapshot && state.prevSnapshot.clients ? state.prevSnapshot.clients[key] : null;
  if(!p) return null;
  return Object.values(p.contracts).reduce((s,x)=>s+x.valorTotalImpago,0);
}
function contractPrev(key, contractId){
  const c = state.prevSnapshot && state.prevSnapshot.clients ? state.prevSnapshot.clients[key] : null;
  return (c && c.contracts && c.contracts[contractId]) || null;
}
function deltaChipHtml(curr, prev, small){
  const cls = small ? 'chip chip-sm' : 'chip';
  if(prev==null) return '<span class="'+cls+' muted">− sin dato previo</span>';
  const diff = curr - prev;
  if(Math.abs(diff) < 0.5) return '<span class="'+cls+' muted">− sin cambios</span>';
  const up = diff > 0;
  return '<span class="'+cls+' '+(up?'danger':'success')+'">'+(up?'▲':'▼')+' '+(up?'+':'-')+esc(money(Math.abs(diff)))+'</span>';
}

// ---------- informe de cuotas por gerencia (agrupado por Grupo, discriminando
// líneas cuando los planes de un mismo grupo no tienen las mismas cuotas) ----------
function computeCuotasReport(gerencia){
  const clientesFiltrados = state.clients.filter(c=> c.contracts.some(ct=>ct.gerencia===gerencia));
  const items = clientesFiltrados.map(c=>{
    const contratos = c.contracts.filter(ct=>ct.gerencia===gerencia);
    const groups = new Map();
    for(const ct of contratos){
      const g = normGrupo(ct.grupo);
      const key = g+'||'+ct.totalPagadas+'||'+ct.totalAdeudado;
      if(!groups.has(key)) groups.set(key, {grupo:g, pagadas:ct.totalPagadas, vencidas:ct.totalAdeudado, count:0, deudaVencida:0, deudaAVencer:0});
      const row = groups.get(key);
      row.count += 1;
      row.deudaVencida += ct.valorTotalImpago;
      row.deudaAVencer += ct.valorTotalPrecancelable;
    }
    let faltaPlan = false;
    const rows = Array.from(groups.values()).sort((a,b)=>
      a.grupo.localeCompare(b.grupo, undefined, {numeric:true}) || b.pagadas-a.pagadas
    );
    rows.forEach(r=>{
      const totalPlan = state.planCuotas.get(r.grupo);
      if(totalPlan==null){ r.aVencer = null; faltaPlan = true; }
      else r.aVencer = totalPlan - r.pagadas - r.vencidas;
    });
    return {
      clientName: c.displayName, clientKey: c.key, rows,
      totalCirculos: contratos.length,
      totalDeudaVencida: contratos.reduce((s,ct)=>s+ct.valorTotalImpago,0),
      totalDeudaAVencer: contratos.reduce((s,ct)=>s+ct.valorTotalPrecancelable,0),
      faltaPlan
    };
  });
  items.sort((a,b)=>a.clientName.localeCompare(b.clientName));
  return items;
}

function getFilterOptions(){
  const estadoOpts = Array.from(new Set(state.clients.flatMap(c=>c.contracts.map(ct=>ct.estado)))).sort();
  const gerenciaOpts = Array.from(new Set(state.clients.flatMap(c=>c.contracts.map(ct=>ct.gerencia)))).sort();
  return {estadoOpts, gerenciaOpts};
}
function buildEstadoGerenciaChecklist(){
  const {estadoOpts, gerenciaOpts} = getFilterOptions();
  return '<div class="filter-group"><label class="title">Estado</label><div class="check-list">'+
      estadoOpts.map(o=>'<label class="check-pill"><input type="checkbox" class="estado-check" value="'+esc(o)+'" '+(state.estadoFilter.has(o)?'checked':'')+' /> '+esc(o||'(sin dato)')+'</label>').join('')+
    '</div></div>'+
    '<div class="filter-group"><label class="title">Gerencia</label><div class="check-list">'+
      gerenciaOpts.map(o=>'<label class="check-pill"><input type="checkbox" class="gerencia-check" value="'+esc(o)+'" '+(state.gerenciaFilter.has(o)?'checked':'')+' /> '+esc(o||'(sin dato)')+'</label>').join('')+
    '</div></div>';
}

function getFilteredClients(){
  let list = state.clients.map(c=>{
    const contractsFiltered = c.contracts.filter(ct=> state.estadoFilter.has(ct.estado) && state.gerenciaFilter.has(ct.gerencia));
    const totalImpago = contractsFiltered.reduce((s,x)=>s+x.valorTotalImpago,0);
    const totalPrecancelable = contractsFiltered.reduce((s,x)=>s+x.valorTotalPrecancelable,0);
    return Object.assign({}, c, {contractsFiltered, totalImpago, totalPrecancelable});
  }).filter(c=>c.contractsFiltered.length>0);

  if(state.search.trim()){
    const q = normName(state.search);
    list = list.filter(c=> normName(c.displayName).includes(q));
  }
  const dir = state.sortDir==='asc' ? 1 : -1;
  list.sort((a,b)=>{
    if(state.sortField==='nombre') return dir*a.displayName.localeCompare(b.displayName);
    if(state.sortField==='planes') return dir*(a.contractsFiltered.length-b.contractsFiltered.length);
    if(state.sortField==='variacion'){
      const pa=clientPrevImpago(a.key), pb=clientPrevImpago(b.key);
      const da=a.totalImpago-(pa==null?a.totalImpago:pa), db=b.totalImpago-(pb==null?b.totalImpago:pb);
      return dir*(da-db);
    }
    return dir*(a.totalImpago-b.totalImpago);
  });
  return list;
}

// ---------- data actions ----------
async function handleProcess(){
  state.error=''; state.notice='';
  if(!state.deudoresFile){ state.error='Subí al menos el archivo de deudores.'; render(); return; }
  state.loading = true; render();
  try{
    const deudoresRows = await readWorkbook(state.deudoresFile);
    const deudoresMap = parseDeudores(deudoresRows);
    if(deudoresMap.size===0) throw new Error('No encontré filas de deudores en el archivo DEUDORES.');

    let nuevosRecibos = 0;
    if(state.recibosFile){
      const recibosRows = await readWorkbook(state.recibosFile);
      const recibosMap = parseRecibos(recibosRows);
      const paymentRecords = buildPaymentRecords(recibosMap);
      await upsertPayments(paymentRecords);
      nuevosRecibos = paymentRecords.length;
    }
    const paymentsByClientMap = await fetchPaymentsByClient();
    const built = buildClients(deudoresMap, paymentsByClientMap);

    const dates = await listSnapshotDates();
    const priorDates = dates.filter(d=>d<state.cutoffDate).sort();
    let prev = null;
    if(priorDates.length>0){
      try{ prev = await getSnapshot(priorDates[priorDates.length-1]); }catch(e){}
    }
    const snap = snapshotFromClients(built, state.cutoffDate);
    const already = dates.includes(state.cutoffDate);
    await saveSnapshot(state.cutoffDate, snap);
    state.snapshotDates = await listSnapshotDates();
    state.generalLoaded = false;

    state.clients = built;
    state.prevSnapshot = prev;
    const estadoOpts = Array.from(new Set(built.flatMap(c=>c.contracts.map(ct=>ct.estado)))).sort();
    const gerenciaOpts = Array.from(new Set(built.flatMap(c=>c.contracts.map(ct=>ct.gerencia)))).sort();
    state.estadoFilter = new Set(estadoOpts);
    state.gerenciaFilter = new Set(gerenciaOpts);
    state.search='';

    const recibosMsg = state.recibosFile
      ? (' Se procesaron '+nuevosRecibos+' recibo(s) del archivo subido (se suman a los que ya tenías guardados).')
      : ' No subiste recibos nuevos, así que los últimos pagos se calculan con lo que ya estaba guardado.';
    state.notice = (already
      ? 'Actualicé la foto compartida del '+shortDate(state.cutoffDate)+' (ya existía una carga para esa fecha).'
      : 'Guardé la foto compartida del '+shortDate(state.cutoffDate)+'.') + recibosMsg;
    state.view='dashboard';
  } catch(e){
    state.error = (e && e.message) ? e.message : 'Ocurrió un error al procesar los archivos.';
  } finally {
    state.loading = false;
    render();
  }
}

function resetToUpload(){
  state.view='upload'; state.deudoresFile=null; state.recibosFile=null;
  state.error=''; state.notice=''; state.cutoffDate=todayISO();
  render();
}

async function loadTrackHistory(key){
  state.trackLoading = true; state.trackHistoryRaw=[]; render();
  try{
    const recent = state.snapshotDates.slice(-60);
    const raw=[];
    for(const d of recent){
      try{
        const snap = await getSnapshot(d);
        if(!snap) continue;
        const c = snap.clients[key];
        if(!c) continue;
        raw.push({date:d, contracts:c.contracts});
      }catch(e){}
    }
    state.trackHistoryRaw = raw;
  } finally { state.trackLoading=false; render(); }
}
// recalcula los totales del cliente seleccionado a partir de lo ya descargado,
// aplicando el filtro de Estado/Gerencia vigente (no vuelve a pedir nada a la base)
function computeTrackHistory(){
  return state.trackHistoryRaw.map(entry=>{
    let impago=0, precancelable=0, adeudado=0;
    for(const ct of Object.values(entry.contracts)){
      if(!state.estadoFilter.has(ct.estado) || !state.gerenciaFilter.has(ct.gerencia)) continue;
      impago+=ct.valorTotalImpago; precancelable+=ct.valorTotalPrecancelable; adeudado+=ct.totalAdeudado;
    }
    return {date:entry.date, impago, precancelable, adeudado};
  });
}

function parsePlanCuotas(rows){
  if(!rows.length) throw new Error('El archivo está vacío.');
  const header = rows[0];
  const col = { grupo: findCol(header, ['grupo']), cuotas: findCol(header, ['cantidad de cuotas del plan']) };
  if(col.grupo===-1 || col.cuotas===-1) throw new Error('El archivo necesita columnas "Grupo" y "Cantidad de Cuotas del Plan".');
  const out = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r[col.grupo]==null || r[col.grupo]==='') continue;
    out.push({grupo:normGrupo(r[col.grupo]), cuotas:Number(r[col.cuotas])||0});
  }
  return out;
}

async function loadPlanCuotas(){
  state.planCuotasLoading = true; render();
  try{
    state.planCuotas = await fetchPlanCuotas();
    state.planCuotasLoaded = true;
  } finally { state.planCuotasLoading=false; render(); }
}

async function handlePlanCuotasFileProcess(){
  if(!state.planCuotasFile){ state.error='Elegí un archivo primero.'; render(); return; }
  state.planCuotasLoading = true; state.error=''; render();
  try{
    const rows = await readWorkbook(state.planCuotasFile);
    const parsed = parsePlanCuotas(rows);
    await upsertPlanCuotas(parsed);
    state.planCuotas = await fetchPlanCuotas();
    state.planCuotasFile = null;
    state.notice = 'Se guardaron '+parsed.length+' grupo(s) de cuotas.';
  } catch(e){
    state.error = (e && e.message) ? e.message : 'No pude leer ese archivo.';
  } finally { state.planCuotasLoading=false; render(); }
}

async function handleAddPlanCuota(){
  const grupo = state.planCuotasEditGrupo.trim();
  const cuotas = Number(state.planCuotasEditCuotas);
  if(!grupo || !cuotas){ state.error='Completá grupo y cantidad de cuotas.'; render(); return; }
  state.planCuotasLoading = true; state.error=''; render();
  try{
    await upsertPlanCuotas([{grupo, cuotas}]);
    state.planCuotas = await fetchPlanCuotas();
    state.planCuotasEditGrupo=''; state.planCuotasEditCuotas='';
  } catch(e){ state.error = (e&&e.message)||'No pude guardar ese grupo.'; }
  finally { state.planCuotasLoading=false; render(); }
}

async function handleDeletePlanCuota(grupo){
  state.planCuotasLoading = true; render();
  try{ await deletePlanCuota(grupo); state.planCuotas = await fetchPlanCuotas(); }
  catch(e){ state.error = (e&&e.message)||'No pude borrar ese grupo.'; }
  finally { state.planCuotasLoading=false; render(); }
}

async function loadGeneralHistory(){
  state.generalLoading = true; render();
  try{
    const dates = await listSnapshotDates();
    state.snapshotDates = dates;
    const recent = dates.slice(-90);
    const raw=[];
    for(const d of recent){
      try{ const snap = await getSnapshot(d); if(snap) raw.push(snap); }catch(e){}
    }
    state.generalRawSnapshots = raw;
    state.generalLoaded = true;
  } finally { state.generalLoading=false; render(); }
}
// ídem para la mora general: recalcula a partir de las fotos ya descargadas
function computeGeneralHistory(){
  return state.generalRawSnapshots.map(snap=> aggregateSnapshotFiltered(snap, state.estadoFilter, state.gerenciaFilter));
}

// ---------- cuotas totales por plan (tabla de referencia, no viene en DEUDORES) ----------
function normGrupo(g){
  let s = (g==null?'':String(g)).trim();
  s = s.replace(/^0+(?=\d)/,''); // "085" y "85" deben ser el mismo grupo
  return s;
}
async function fetchPlanCuotas(){
  const {data, error} = await sb.from('plan_cuotas').select('grupo,cuotas').order('grupo');
  if(error) throw error;
  const map = new Map();
  for(const r of (data||[])) map.set(normGrupo(r.grupo), Number(r.cuotas));
  return map;
}
async function upsertPlanCuotas(rows){
  if(!rows.length) return;
  const payload = rows.map(r=>({grupo:normGrupo(r.grupo), cuotas:Number(r.cuotas)||0}));
  const {error} = await sb.from('plan_cuotas').upsert(payload, {onConflict:'grupo'});
  if(error) throw error;
}
async function deletePlanCuota(grupo){
  const {error} = await sb.from('plan_cuotas').delete().eq('grupo', normGrupo(grupo));
  if(error) throw error;
}

function handleAuthSubmit(){
  const val = document.getElementById('auth-password').value;
  if(val === APP_PASSWORD){
    localStorage.setItem('morosidad_auth','ok');
    state.authed = true;
    render();
  } else {
    document.getElementById('auth-error').style.display='block';
  }
}

const root = document.getElementById('app');

function render(){
  root.innerHTML = '';
  if(state.booting){ root.innerHTML = '<div class="empty"><span class="spin">⟳</span> Cargando...</div>'; return; }
  if(!state.configOk){ root.innerHTML = buildConfigNeeded(); return; }
  if(!state.dbOk){ root.innerHTML = buildDbNeeded(); return; }
  if(!state.authed){ root.innerHTML = buildAuth(); attachAuthEvents(); return; }

  let html = buildHeader();
  if(state.view==='upload') html += buildUpload();
  else if(state.view==='dashboard') html += buildDashboard();
  else if(state.view==='mora-general') html += buildMoraGeneral();
  else if(state.view==='seguimiento') html += buildSeguimiento();
  else if(state.view==='informe') html += buildInforme();
  root.innerHTML = html;
  attachEvents();
  if(state.view==='mora-general') drawGeneralChart();
  if(state.view==='seguimiento') drawTrackChart();
}

function buildUpload(){
  const lastNotice = state.snapshotDates.length ?
    '<div class="chip" style="color:#64748b;background:#fff;border:1px solid var(--border);border-radius:8px;padding:7px 12px;width:fit-content;margin-bottom:20px;">⏱ Última foto guardada: <b class="font-num">'+esc(shortDate(state.snapshotDates[state.snapshotDates.length-1]))+'</b> · '+state.snapshotDates.length+' foto(s) en total</div>' : '';
  return '<div class="narrow">'+
    '<h2 class="section-title">Cargar archivos del día</h2>'+
    '<p class="section-sub">El archivo de deudores es obligatorio siempre (refleja el estado actual completo). El de recibos es opcional: subí solo los pagos nuevos que todavía no cargaste — se van sumando a los que ya tenés guardados, no hace falta subir el historial completo cada vez.</p>'+

// ---------- exportar a Excel (con el mismo diseño de colores) ----------
function thinBorderAll(){ return {top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}}; }
function sanitizeSheetName(name){ return (name||'Hoja').replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31) || 'Hoja'; }
function sanitizeFilename(name){ return (name||'archivo').replace(/[^A-Za-z0-9 ._-]/g,'_').slice(0,80); }
function downloadBlob(buffer, filename){
  const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function addClientReportSheet(wb, it){
  const ws = wb.addWorksheet(sanitizeSheetName(it.clientName));
  ws.columns = [{width:30},{width:9},{width:10},{width:9},{width:10},{width:10},{width:16},{width:16}];

  ws.mergeCells('A1:H1');
  const title = ws.getCell('A1');
  title.value = 'DEUDA COLSERVICE';
  title.font = {bold:true, color:{argb:'FFFFFFFF'}, size:13};
  title.alignment = {horizontal:'center', vertical:'middle'};
  title.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF0A70A1'}};
  ws.getRow(1).height = 22;

  ws.mergeCells('A2:A3'); ws.mergeCells('B2:B3'); ws.mergeCells('C2:C3');
  ws.mergeCells('D2:F2'); ws.mergeCells('G2:H2');
  ws.getCell('A2').value='CLIENTE'; ws.getCell('B2').value='GRUPO'; ws.getCell('C2').value='CÍRCULOS';
  ws.getCell('D2').value='CUOTAS'; ws.getCell('G2').value='DEUDA';
  ws.getCell('D3').value='PAGAS'; ws.getCell('E3').value='VENCIDAS'; ws.getCell('F3').value='A VENCER';
  ws.getCell('G3').value='VENCIDA'; ws.getCell('H3').value='A VENCER';
  ['A2','B2','C2','D2','G2','D3','E3','F3','G3','H3'].forEach(addr=>{
    const cell = ws.getCell(addr);
    cell.font = {bold:true};
    cell.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFD9D9D9'}};
    cell.border = thinBorderAll();
  });

  let r = 4;
  const firstDataRow = r;
  it.rows.forEach(row=>{
    ws.getCell('B'+r).value = row.grupo;
    ws.getCell('C'+r).value = row.count;
    ws.getCell('D'+r).value = row.pagadas;
    ws.getCell('E'+r).value = row.vencidas;
    ws.getCell('F'+r).value = row.aVencer==null ? '?' : row.aVencer;
    ws.getCell('G'+r).value = row.deudaVencida; ws.getCell('G'+r).numFmt = '"$"#,##0.00';
    ws.getCell('H'+r).value = row.deudaAVencer; ws.getCell('H'+r).numFmt = '"$"#,##0.00';
    ['B','C','D','E','F','G','H'].forEach(col=>{
      const cell = ws.getCell(col+r);
      cell.alignment = {horizontal:'center'};
      cell.border = thinBorderAll();
    });
    r++;
  });
  ws.getCell('B'+r).value = 'TOTAL'; ws.getCell('B'+r).font = {bold:true};
  ws.getCell('C'+r).value = it.totalCirculos; ws.getCell('C'+r).font = {bold:true};
  ['B','C','D','E','F','G','H'].forEach(col=>{ ws.getCell(col+r).border = thinBorderAll(); ws.getCell(col+r).alignment={horizontal:'center'}; });
  const totalRow = r; r++;

  ws.mergeCells('A'+firstDataRow+':A'+totalRow);
  const clientCell = ws.getCell('A'+firstDataRow);
  clientCell.value = it.clientName;
  clientCell.font = {bold:true};
  clientCell.alignment = {horizontal:'left', vertical:'middle', wrapText:true};
  for(let rr=firstDataRow; rr<=totalRow; rr++){ ws.getCell('A'+rr).border = thinBorderAll(); }

  ws.mergeCells('A'+r+':F'+r);
  ws.getCell('A'+r).value = 'TOTALES';
  ws.getCell('A'+r).alignment = {horizontal:'center', vertical:'middle'};
  ws.getCell('G'+r).value = it.totalDeudaVencida; ws.getCell('G'+r).numFmt = '"$"#,##0.00';
  ws.getCell('H'+r).value = it.totalDeudaAVencer; ws.getCell('H'+r).numFmt = '"$"#,##0.00';
  ['A','G','H'].forEach(col=>{
    const cell = ws.getCell(col+r);
    cell.font = {bold:true};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFFFF00'}};
    cell.border = thinBorderAll();
  });
}
async function exportClientReportExcel(it){
  const wb = new ExcelJS.Workbook();
  addClientReportSheet(wb, it);
  const buf = await wb.xlsx.writeBuffer();
  downloadBlob(buf, sanitizeFilename(it.clientName)+'.xlsx');
}
async function exportAllReportsExcel(items){
  const wb = new ExcelJS.Workbook();
  items.forEach(it=> addClientReportSheet(wb, it));
  const buf = await wb.xlsx.writeBuffer();
  downloadBlob(buf, 'Informe_cuotas_'+sanitizeFilename(state.informeGerencia)+'.xlsx');
}

// ---------- copiar para pegar en el cuerpo de un mail ----------
function buildClientReportEmailHtml(it){
  const th = 'style="border:1px solid #94a3b8;padding:6px 10px;font-size:12px;background:#D9D9D9;font-weight:bold;text-align:center;"';
  const td = 'style="border:1px solid #94a3b8;padding:6px 10px;font-size:12px;text-align:center;"';
  const tdLeft = 'style="border:1px solid #94a3b8;padding:6px 10px;font-size:12px;text-align:left;vertical-align:middle;"';
  let html = '<table style="border-collapse:collapse;font-family:Arial,sans-serif;">'+
    '<tr><td colspan="8" style="background:#0A70A1;color:#fff;font-weight:bold;text-align:center;padding:8px;font-size:14px;">DEUDA COLSERVICE</td></tr>'+
    '<tr><th '+th+' rowspan="2">CLIENTE</th><th '+th+' rowspan="2">GRUPO</th><th '+th+' rowspan="2">CÍRCULOS</th>'+
    '<th '+th+' colspan="3">CUOTAS</th><th '+th+' colspan="2">DEUDA</th></tr>'+
    '<tr><th '+th+'>PAGAS</th><th '+th+'>VENCIDAS</th><th '+th+'>A VENCER</th><th '+th+'>VENCIDA</th><th '+th+'>A VENCER</th></tr>';
  it.rows.forEach((r,idx)=>{
    html += '<tr>';
    if(idx===0) html += '<td '+tdLeft+' rowspan="'+(it.rows.length+1)+'"><b>'+esc(it.clientName)+'</b></td>';
    html += '<td '+td+'>'+esc(r.grupo)+'</td><td '+td+'>'+r.count+'</td><td '+td+'>'+r.pagadas+'</td><td '+td+'>'+r.vencidas+'</td>'+
      '<td '+td+'>'+(r.aVencer==null?'?':r.aVencer)+'</td><td '+td+'>'+esc(money(r.deudaVencida))+'</td><td '+td+'>'+esc(money(r.deudaAVencer))+'</td></tr>';
  });
  html += '<tr><td '+td+'><b>TOTAL</b></td><td '+td+'><b>'+it.totalCirculos+'</b></td><td '+td+'></td><td '+td+'></td><td '+td+'></td><td '+td+'></td><td '+td+'></td></tr>';
  html += '<tr><td colspan="6" style="border:1px solid #94a3b8;padding:6px 10px;font-size:12px;text-align:center;background:#FFFF00;font-weight:bold;">TOTALES</td>'+
    '<td style="border:1px solid #94a3b8;padding:6px 10px;font-size:12px;text-align:center;background:#FFFF00;font-weight:bold;">'+esc(money(it.totalDeudaVencida))+'</td>'+
    '<td style="border:1px solid #94a3b8;padding:6px 10px;font-size:12px;text-align:center;background:#FFFF00;font-weight:bold;">'+esc(money(it.totalDeudaAVencer))+'</td></tr>'+
    '</table>';
  return html;
}
function copyClientReportForEmail(it){
  const html = buildClientReportEmailHtml(it);
  const container = document.createElement('div');
  container.style.position='fixed'; container.style.left='-9999px'; container.style.top='0';
  container.contentEditable = 'true';
  container.innerHTML = html;
  document.body.appendChild(container);
  const range = document.createRange();
  range.selectNodeContents(container);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
  let ok=false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok=false; }
  sel.removeAllRanges();
  document.body.removeChild(container);
  state.notice = ok ? ('Tabla de '+it.clientName+' copiada. Pegala en el cuerpo del mail (Ctrl+V).') : 'No pude copiar automáticamente; seleccioná la tabla en pantalla y copiala manualmente.';
  render();
}

// ---------- events ----------
function attachEvents(){
  root.addEventListener('click', onRootClick);
  root.addEventListener('input', onRootInput);
  root.addEventListener('change', onRootChange);
}
function onRootClick(e){
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  if(action==='goto'){
    state.view = btn.dataset.view;
    if(state.view==='mora-general' && !state.generalLoaded){ loadGeneralHistory(); return; }
    if(state.view==='informe' && !state.planCuotasLoaded){ loadPlanCuotas().then(()=>{ if(!state.informeGerencia){ const {gerenciaOpts}=getFilterOptions(); state.informeGerencia = gerenciaOpts.includes('H.Prieto') ? 'H.Prieto' : (gerenciaOpts[0]||''); render(); } }); return; }
    render();
  } else if(action==='toggle-client'){
    const key = btn.dataset.key;
    const detail = document.getElementById('detail-'+safeId(key));
    const chev = document.getElementById('chev-'+safeId(key));
    if(detail){
      const open = detail.style.display==='block';
      detail.style.display = open ? 'none' : 'block';
      if(chev) chev.textContent = open ? '▸' : '▾';
    }
  } else if(action==='process'){ handleProcess();
  } else if(action==='reset-upload'){ resetToUpload();
  } else if(action==='sort-dir'){
    state.sortDir = state.sortDir==='desc' ? 'asc' : 'desc';
    refreshDashboardList();
  } else if(action==='auth-submit'){ handleAuthSubmit();
  } else if(action==='informe-refresh'){ state.error=''; state.notice=''; render();
  } else if(action==='informe-download-all'){
    const items = computeCuotasReport(state.informeGerencia);
    if(items.length) exportAllReportsExcel(items);
  } else if(action==='informe-download'){
    const key = btn.dataset.key;
    const it = computeCuotasReport(state.informeGerencia).find(x=>x.clientKey===key);
    if(it) exportClientReportExcel(it);
  } else if(action==='informe-copy'){
    const key = btn.dataset.key;
    const it = computeCuotasReport(state.informeGerencia).find(x=>x.clientKey===key);
    if(it) copyClientReportForEmail(it);
  } else if(action==='plancuotas-upload'){ handlePlanCuotasFileProcess();
  } else if(action==='plancuotas-add'){ handleAddPlanCuota();
  } else if(action==='plancuotas-delete'){ handleDeletePlanCuota(btn.dataset.grupo); }
}
function onRootInput(e){
  if(e.target.id==='search-input'){ state.search = e.target.value; refreshDashboardList(); }
  else if(e.target.id==='cutoff-date'){ state.cutoffDate = e.target.value; }
  else if(e.target.id==='deudores-file'){ state.deudoresFile = e.target.files[0]||null; render(); }
  else if(e.target.id==='recibos-file'){ state.recibosFile = e.target.files[0]||null; render(); }
  else if(e.target.id==='plancuotas-file'){ state.planCuotasFile = e.target.files[0]||null; }
  else if(e.target.id==='plancuotas-grupo'){ state.planCuotasEditGrupo = e.target.value; }
  else if(e.target.id==='plancuotas-cuotas'){ state.planCuotasEditCuotas = e.target.value; }
}
function onRootChange(e){
  if(e.target.id==='sort-field'){ state.sortField = e.target.value; refreshDashboardList(); }
  else if(e.target.classList.contains('estado-check')){ toggleSetItem(state.estadoFilter, e.target.value); refreshFilteredView(); }
  else if(e.target.classList.contains('gerencia-check')){ toggleSetItem(state.gerenciaFilter, e.target.value); refreshFilteredView(); }
  else if(e.target.id==='track-client-select'){
    state.trackClientKey = e.target.value;
    if(e.target.value) loadTrackHistory(e.target.value);
    else { state.trackHistoryRaw=[]; render(); }
  }
  else if(e.target.id==='informe-gerencia-select'){ state.informeGerencia = e.target.value; state.notice=''; state.error=''; render(); }
}
// aplica el cambio de filtro a la pestaña que esté abierta en ese momento;
// mora general y por cliente ya tienen los datos descargados, así que
// recalculan al instante sin volver a pedirle nada a la base
function refreshFilteredView(){
  if(state.view==='dashboard') refreshDashboardList();
  else render();
}
function refreshDashboardList(){
  const listEl = document.getElementById('client-list');
  if(!listEl) return;
  const filtered = getFilteredClients();
  listEl.innerHTML = renderClientListInner(filtered);
  const sortBtn = document.getElementById('sort-dir-btn');
  if(sortBtn) sortBtn.textContent = state.sortDir==='desc' ? '↓ Mayor a menor' : '↑ Menor a mayor';
  // refresh the 4 stat cards without touching the filter bar / search focus
  const totalImpago = filtered.reduce((s,c)=>s+c.totalImpago,0);
  const totalPrecancelable = filtered.reduce((s,c)=>s+c.totalPrecancelable,0);
  const totalContratos = filtered.reduce((s,c)=>s+c.contractsFiltered.length,0);
  let prevTotalImpago = null;
  if(state.prevSnapshot) prevTotalImpago = filtered.reduce((s,c)=>{ const p=clientPrevImpago(c.key); return s+(p==null?0:p); },0);
  const grid = document.querySelector('.grid-4');
  if(grid){
    grid.innerHTML = statCard('Clientes (filtro actual)', filtered.length, 'slate')+
      statCard('Contratos (filtro actual)', totalContratos, 'slate')+
      statCard('Deuda vencida (impaga)', money(totalImpago), 'rose', deltaChipHtml(totalImpago, prevTotalImpago))+
      statCard('A vencer (precancelable)', money(totalPrecancelable), 'slate');
  }
}

// ---------- boot ----------
(async function init(){
  state.configOk = configLooksValid();
  if(!state.configOk){ state.booting=false; render(); return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  state.authed = APP_PASSWORD ? (localStorage.getItem('morosidad_auth')==='ok') : true;
  try{
    state.snapshotDates = await listSnapshotDates();
    state.dbOk = true;
    if(state.authed && state.snapshotDates.length>0){
      const latest = state.snapshotDates[state.snapshotDates.length-1];
      const snap = await getSnapshot(latest);
      if(snap){
        state.clients = clientsFromSnapshot(snap);
        try{
          const paymentsByClientMap = await fetchPaymentsByClient();
          state.clients.forEach(c=>{ c.payments = paymentsByClientMap.get(c.key) || []; });
        }catch(e){ /* si falla, se muestran igual los contratos sin los últimos pagos */ }
        const estadoOpts = Array.from(new Set(state.clients.flatMap(c=>c.contracts.map(ct=>ct.estado)))).sort();
        const gerenciaOpts = Array.from(new Set(state.clients.flatMap(c=>c.contracts.map(ct=>ct.gerencia)))).sort();
        state.estadoFilter = new Set(estadoOpts);
        state.gerenciaFilter = new Set(gerenciaOpts);
        const prior = state.snapshotDates.filter(d=>d<latest);
        if(prior.length) state.prevSnapshot = await getSnapshot(prior[prior.length-1]);
        state.notice = 'Mostrando la última foto guardada ('+shortDate(latest)+'). Subí archivos nuevos para actualizarla.';
        state.view = 'dashboard';
      }
    }
  } catch(e){
    state.dbOk = false;
  }
  state.booting = false;
  render();
})();
</script>
