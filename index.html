    --bg:#f5f8fb; --card:#ffffff; --border:#dbe6ef; --text:#0d2436; --muted:#5b7387;
    --dark:#06304A; --teal:#0A70A1; --teal-dark:#075A8A; --teal-light:#EAF3FA;
    --rose:#e11d48; --rose-light:#fff1f2; --emerald:#059669;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
  .font-display{font-family:'Newsreader',serif;}
  .font-num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  header.app-header{background:var(--dark);color:#fff;}
  .header-inner{max-width:1100px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-badge{width:40px;height:40px;border-radius:9px;overflow:hidden;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:center;}
  .brand-badge img{width:100%;height:100%;object-fit:cover;}
  .brand h1{font-size:19px;margin:0;line-height:1;}
  .brand p{font-size:12px;color:#94a3b8;margin:4px 0 0;}
  .nav{display:flex;background:#1e293b;border-radius:8px;padding:4px;gap:2px;}
  .nav button{background:transparent;border:none;color:#cbd5e1;padding:7px 12px;border-radius:6px;font-size:13px;font-weight:500;}
  .nav button.active{background:var(--teal);color:var(--dark);}
  .btn-ghost{display:flex;align-items:center;gap:6px;background:transparent;border:none;color:#cbd5e1;padding:7px 12px;border-radius:6px;font-size:13px;}
  .btn-ghost-dark{background:transparent;border:none;color:var(--teal-dark);font-size:13px;font-weight:500;cursor:pointer;padding:0;}
  .btn-ghost-dark:hover{text-decoration:underline;}
  .btn-ghost:hover{background:#1e293b;color:#fff;}

  main{max-width:1100px;margin:0 auto;padding:32px 24px;}
  .narrow{max-width:640px;}

  h2.section-title{font-family:'Newsreader',serif;font-size:22px;margin:0 0 6px;}
  .section-sub{color:var(--muted);font-size:14px;margin:0 0 20px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;}
  .pad{padding:16px;}

  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
  .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media(max-width:800px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;} }

  .stat-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .stat-value{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;margin-top:6px;}
  .stat-head{display:flex;align-items:center;justify-content:space-between;}
  .stat-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .stat-icon.rose{background:var(--rose-light);color:var(--rose);}
  .stat-icon.slate{background:#f1f5f9;color:#475569;}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-family:'IBM Plex Mono',monospace;}
  .chip-sm{font-size:11px;}
  .chip.danger{color:var(--rose);}
  .chip.success{color:var(--emerald);}
  .chip.muted{color:#94a3b8;}

  .filter-bar{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;}
  .filter-group{display:flex;flex-direction:column;gap:6px;}
  .filter-group label.title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .check-list{display:flex;flex-wrap:wrap;gap:6px;max-width:260px;}
  .check-pill{display:flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:12px;background:#fff;}
  .search-wrap{position:relative;flex:1;min-width:200px;}
  .search-wrap input{width:100%;padding:9px 12px 9px 30px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;}
  .search-wrap span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#94a3b8;}
  select{border:1px solid #cbd5e1;border-radius:8px;padding:9px 10px;font-size:13px;background:#fff;}
  .btn{border:1px solid #cbd5e1;border-radius:8px;padding:9px 12px;font-size:13px;background:#fff;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{background:#f8fafc;}
  .btn-primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;width:100%;justify-content:center;padding:12px;border-radius:10px;font-size:14px;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-primary:disabled{background:#cbd5e1;border-color:#cbd5e1;cursor:not-allowed;}

  .client-row{border-bottom:1px solid #f1f5f9;}
  .client-row:last-child{border-bottom:none;}
  .client-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:none;border:none;text-align:left;}
  .client-head:hover{background:#f8fafc;}
  .client-name{font-weight:500;font-size:14px;}
  .client-sub{font-size:12px;color:#94a3b8;}
  .client-detail{display:none;padding:4px 18px 18px;background:#f8fafc99;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead tr{background:#f8fafc;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
  th,td{padding:8px 12px;text-align:left;}
  th.r,td.r{text-align:right;}
  tbody tr{border-top:1px solid #f1f5f9;}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:#fff;margin-bottom:14px;}
  .badge{font-size:11px;padding:2px 9px;border-radius:20px;background:#f1f5f9;color:#475569;}
  .badge.teal{background:var(--teal-light);color:var(--teal-dark);}

  .banner{display:flex;align-items:flex-start;gap:8px;border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:20px;}
  .banner.info{background:var(--teal-light);color:var(--teal-dark);border:1px solid #99f6e4;}
  .banner.error{background:var(--rose-light);color:#be123c;border:1px solid #fecdd3;}
  .banner.notice{background:var(--teal-light);color:var(--teal-dark);border:1px solid #99f6e4;}

  .dropzone{border:2px dashed #cbd5e1;border-radius:10px;padding:22px;text-align:center;cursor:pointer;background:#fff;}
  .dropzone.filled{border-color:var(--teal);background:var(--teal-light);}
  .dropzone .circle{width:40px;height:40px;border-radius:50%;background:#f1f5f9;color:#94a3b8;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:18px;}
  .dropzone.filled .circle{background:var(--teal);color:#fff;}
  .dropzone .label{font-weight:500;font-size:14px;}
  .dropzone .hint{font-size:12px;color:#94a3b8;margin-top:2px;}
  .dropzone .filename{font-size:12px;color:var(--teal-dark);margin-top:6px;}

  .auth-card{max-width:360px;margin:80px auto;padding:28px;}
  .auth-card input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;margin:14px 0;}

  .spin{display:inline-block;animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .empty{padding:40px;text-align:center;color:#94a3b8;font-size:13.5px;}
  .muted-italic{font-style:italic;color:#94a3b8;font-size:13.5px;}
  .chart-box{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:18px;height:280px;}

  .report-table{border-collapse:collapse;width:100%;min-width:660px;}
  .report-table th,.report-table td{border:1px solid #94a3b8;padding:6px 10px;font-size:12.5px;text-align:center;}
  .report-table thead th{background:#e2e8f0;font-weight:700;}
  .report-table .report-title{background:var(--teal);color:#fff;font-size:14px;padding:8px;}
  .report-table .report-client{font-weight:600;vertical-align:middle;text-align:left;background:#f8fafc;}
  .report-table .report-totales{background:#FFF176;font-weight:700;}
  .report-table .report-totales td:first-child{text-align:center;}

  /* ---- asistente flotante ---- */
  .chat-fab{position:fixed;bottom:22px;right:22px;width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;border:none;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:24px;display:flex;align-items:center;justify-content:center;z-index:1000;cursor:pointer;}
  .chat-fab:hover{background:var(--teal-dark);}
  .chat-panel{position:fixed;bottom:90px;right:22px;width:360px;max-width:92vw;height:480px;max-height:75vh;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden;z-index:1000;border:1px solid var(--border);}
  .chat-head{background:var(--dark);color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:600;}
  .chat-head-btns{display:flex;gap:6px;}
  .chat-head button{background:rgba(255,255,255,.12);border:none;color:#fff;width:26px;height:26px;border-radius:6px;font-size:13px;cursor:pointer;}
  .chat-head button.active{background:var(--teal);}
  .chat-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f8fafc;}
  .chat-msg{max-width:85%;padding:8px 11px;border-radius:10px;font-size:13px;line-height:1.4;}
  .chat-msg.user{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:2px;}
  .chat-msg.bot{align-self:flex-start;background:#e2e8f0;color:var(--text);border-bottom-left-radius:2px;}
  .chat-input-row{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border);background:#fff;}
  .chat-input-row input{flex:1;border:1px solid #cbd5e1;border-radius:20px;padding:8px 14px;font-size:13px;}
  .chat-input-row button{width:36px;height:36px;border-radius:50%;border:none;background:var(--teal);color:#fff;font-size:15px;cursor:pointer;flex-shrink:0;}
  .chat-input-row button.mic.listening{background:var(--rose);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(225,29,72,.5);}70%{box-shadow:0 0 0 9px rgba(225,29,72,0);}100%{box-shadow:0 0 0 0 rgba(225,29,72,0);}}
  .chat-hint{font-size:11px;color:#94a3b8;padding:0 12px 8px;}

  /* ---- switcher de empresa ---- */
  .empresa-switch{display:flex;background:#1e293b;border-radius:8px;padding:4px;gap:2px;}
  .empresa-switch button{background:transparent;border:none;color:#cbd5e1;padding:7px 12px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;}
  .empresa-switch button.active{background:#fff;color:var(--dark);}

  /* ---- Transcol: matriz de riesgo ---- */
  .semaforo-badge{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:700;font-size:15px;}
  .semaforo-badge.VERDE{background:#dcfce7;color:#166534;}
  .semaforo-badge.AMARILLO{background:#fef9c3;color:#854d0e;}
  .semaforo-badge.ROJO{background:#fee2e2;color:#991b1b;}
  .score-bar-track{background:#e2e8f0;border-radius:20px;height:14px;overflow:hidden;}
  .score-bar-fill{height:100%;border-radius:20px;transition:width .3s;}
  .score-bar-fill.VERDE{background:#22c55e;}
  .score-bar-fill.AMARILLO{background:#eab308;}
  .score-bar-fill.ROJO{background:#ef4444;}
  .doc-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;flex-wrap:wrap;}
  .doc-row .doc-label{flex:1;min-width:160px;font-size:13px;font-weight:500;}
  .doc-status{font-size:12px;padding:3px 9px;border-radius:20px;}
  .doc-status.pendiente{background:#f1f5f9;color:#64748b;}
  .doc-status.leyendo{background:var(--teal-light);color:var(--teal-dark);}
  .doc-status.leido{background:#dcfce7;color:#166534;}
  .doc-status.error{background:#fee2e2;color:#991b1b;}
  .bloque-card{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;}
  .bloque-card .bloque-head{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px;}
  .bloque-card .bloque-detalle{font-size:12.5px;color:var(--muted);}
  .bloque-card .bloque-brecha{font-size:11.5px;color:#b45309;font-style:italic;margin-top:4px;}
</style>
</head>

// ---------- helpers ----------
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function safeId(k){ return (k||'').toString().replace(/[^A-Za-z0-9_-]/g,'_'); }
function normName(s){ return (s||'').toString().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim(); }
function money(n){ return (n||0).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}); }
function shortDate(d){ if(!d) return '—'; const dt = d instanceof Date ? d : new Date(d); if(isNaN(dt)) return '—'; return dt.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function toggleSetItem(set,val){ if(set.has(val)) set.delete(val); else set.add(val); }

function readWorkbook(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
        resolve(rows);
      } catch(err){ reject(err); }
    };
    reader.onerror = ()=> reject(new Error('No se pudo leer el archivo'));
    reader.readAsArrayBuffer(file);
  });
}

// ---------- lectura de columnas por nombre (no por posición) ----------
// así el programa sigue funcionando aunque el orden de las columnas cambie
// entre un archivo y otro.
function normHeader(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
function findCol(headerRow, exactNames){
  const normalized = headerRow.map(h=>normHeader(h));
  for(const name of exactNames){
    const idx = normalized.indexOf(name);
    if(idx !== -1) return idx;
  }
  return -1;
}
// para "Monto": puede haber más de una columna que contenga la palabra, nos
// quedamos con la ÚLTIMA que se llame exactamente "monto" (según lo pedido).
function findLastExactCol(headerRow, name){
  const normalized = headerRow.map(h=>normHeader(h));
  let found = -1;
  normalized.forEach((h,i)=>{ if(h===name) found=i; });
  return found;
}

function parseDeudores(rows){
  if(!rows.length) throw new Error('El archivo de deudores está vacío.');
  const header = rows[0];
  const col = {
    razonSocial: findCol(header, ['razon social']),
    grupo: findCol(header, ['grupo']),
    orden: findCol(header, ['orden']),
    estado: findCol(header, ['estado']),
    gerencia: findCol(header, ['gerencia']),
    totalPagadas: findCol(header, ['total pagadas']),
    totalAdeudado: findCol(header, ['total adeudado']),
    valorImpago: findCol(header, ['valor total impago']),
    valorPrecancelable: findCol(header, ['valor total precancelable']),
  };
  const faltantes = Object.entries(col).filter(([k,v])=>v===-1).map(([k])=>k);
  if(faltantes.length) throw new Error('No encontré estas columnas en el archivo de deudores: '+faltantes.join(', ')+'. Revisá que los encabezados no hayan cambiado de nombre.');

  const clients = new Map();
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r[col.razonSocial]==null || r[col.razonSocial]==='') continue;
    const displayName = String(r[col.razonSocial]).trim();
    const key = normName(displayName);
    const contract = {
      id: (r[col.grupo]+'-'+r[col.orden]), grupo:r[col.grupo], orden:r[col.orden],
      estado:(r[col.estado]||'').toString().trim(), gerencia:(r[col.gerencia]||'').toString().trim(),
      totalPagadas:Number(r[col.totalPagadas])||0, totalAdeudado:Number(r[col.totalAdeudado])||0,
      valorTotalImpago:Number(r[col.valorImpago])||0, valorTotalPrecancelable:Number(r[col.valorPrecancelable])||0,
    };
    if(!clients.has(key)) clients.set(key,{key,displayName,contracts:[]});
    clients.get(key).contracts.push(contract);
  }
  return clients;
}

function parseRecibos(rows){
  if(!rows.length) throw new Error('El archivo de recibos está vacío.');
  const header = rows[0];
  const col = {
    nombre: findCol(header, ['nombre']),
    numeroRecibo: findCol(header, ['numero de recibo']),
    fecha: findCol(header, ['fecha']),
    estadoPago: findCol(header, ['estado de pago']),
    monto: findLastExactCol(header, 'monto'),
  };
  const faltantes = Object.entries(col).filter(([k,v])=>v===-1).map(([k])=>k);
  if(faltantes.length) throw new Error('No encontré estas columnas en el archivo de recibos: '+faltantes.join(', ')+'. Revisá que los encabezados no hayan cambiado de nombre.');

  const byClient = new Map();
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r[col.nombre]==null) continue;
    if((r[col.estadoPago]||'').toString().trim() !== 'Registrado') continue;
    const key = normName(r[col.nombre]);
    const fechaVal = r[col.fecha];
    const payment = { fecha: fechaVal instanceof Date ? fechaVal : (fechaVal? new Date(fechaVal):null), numeroRecibo:r[col.numeroRecibo]||'', monto:Number(r[col.monto])||0 };
    if(!byClient.has(key)) byClient.set(key,[]);
    byClient.get(key).push(payment);
  }
  for(const list of byClient.values()) list.sort((a,b)=> (b.fecha?b.fecha.getTime():0)-(a.fecha?a.fecha.getTime():0));
  return byClient;
}

function buildClients(deudoresMap, paymentsByClientMap){
  const out=[];
  for(const c of deudoresMap.values()){
    const payments = paymentsByClientMap.get(c.key) || [];
    out.push(Object.assign({}, c, {payments}));
  }
  return out;
}

// convierte los pagos "Registrado" de un archivo RECIBOS en filas listas para
// guardar de forma acumulativa (no se pierden al subir un archivo distinto)
function buildPaymentRecords(recibosMap){
  const out = [];
  for(const [key, list] of recibosMap.entries()){
    for(const p of list){
      const fechaStr = p.fecha ? p.fecha.toISOString().slice(0,10) : null;
      const numero = (p.numeroRecibo!=null && p.numeroRecibo!=='') ? String(p.numeroRecibo) : null;
      const idPart = numero || ((fechaStr||'sinfecha')+'-'+p.monto);
      out.push({ id: key+'::'+idPart, client_key:key, fecha: fechaStr, numero_recibo: numero, monto: p.monto });
    }
  }
  return out;
}

function snapshotFromClients(clients, date){
  const byClient = {};
  for(const c of clients){
    const contracts = {};
    for(const ct of c.contracts){
      contracts[ct.id] = {estado:ct.estado, gerencia:ct.gerencia, totalPagadas:ct.totalPagadas, totalAdeudado:ct.totalAdeudado, valorTotalImpago:ct.valorTotalImpago, valorTotalPrecancelable:ct.valorTotalPrecancelable};
    }
    byClient[c.key] = { displayName:c.displayName, contracts };
  }
  return {date, clients:byClient};
}

function clientsFromSnapshot(snap){
  return Object.entries(snap.clients).map(([key,c])=>{
    const contracts = Object.entries(c.contracts).map(([id,ct])=>{
      const idx = id.indexOf('-'); const grupo = id.slice(0,idx); const orden = id.slice(idx+1);
      return Object.assign({id, grupo, orden}, ct);
    });
    return {key, displayName:c.displayName, contracts, payments:[]};
  });
}

function aggregateSnapshotFiltered(snap, estadoFilter, gerenciaFilter, minCuotasAdeudadas){
  const minCuotas = Number(minCuotasAdeudadas);
  const hasMinFilter = minCuotasAdeudadas!=='' && minCuotasAdeudadas!=null && !isNaN(minCuotas);
  let impago=0, precancelable=0, adeudado=0, contratos=0, clientesEnMora=0, clientesCount=0;
  for(const c of Object.values(snap.clients)){
    let clienteImpago=0, tieneAlguno=false;
    for(const ct of Object.values(c.contracts)){
      if(!estadoFilter.has(ct.estado) || !gerenciaFilter.has(ct.gerencia)) continue;
      if(hasMinFilter && ct.totalAdeudado < minCuotas) continue;
      impago += ct.valorTotalImpago; precancelable += ct.valorTotalPrecancelable; adeudado += ct.totalAdeudado; contratos += 1;
      clienteImpago += ct.valorTotalImpago; tieneAlguno = true;
    }
    if(tieneAlguno) clientesCount += 1;
    if(clienteImpago>0) clientesEnMora += 1;
  }
  return {date:snap.date, impago, precancelable, adeudado, contratos, clientesEnMora, clientes:clientesCount};
}

// ---------- Supabase ----------
let sb = null;
function configLooksValid(){
  return SUPABASE_URL && !SUPABASE_URL.includes('PEGA_AQUI') && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('PEGA_AQUI');
}
async function listSnapshotDates(){
  const {data, error} = await sb.from('snapshots').select('date').order('date',{ascending:true});
  if(error) throw error;
  return (data||[]).map(r=>r.date);
}
async function getSnapshot(date){
  const {data, error} = await sb.from('snapshots').select('data').eq('date', date).maybeSingle();
  if(error) throw error;
  return data ? data.data : null;
}
async function saveSnapshot(date, snap){
  const {error} = await sb.from('snapshots').upsert({date, data:snap});
  if(error) throw error;
}

// guarda los pagos "Registrado" de forma acumulativa: subir el mismo recibo
// dos veces no duplica nada (se pisa por id), así que es seguro re-subir
// el mismo archivo o solapar meses.
async function upsertPayments(records){
  if(!records.length) return;
  const chunkSize = 500;
  for(let i=0;i<records.length;i+=chunkSize){
    const chunk = records.slice(i,i+chunkSize);
    const {error} = await sb.from('payments').upsert(chunk, {onConflict:'id'});
    if(error) throw error;
  }
}
// trae, para cada cliente, los últimos 3 pagos considerando TODO lo acumulado
// hasta ahora (no solo el último archivo subido)
async function fetchPaymentsByClient(){
  const {data, error} = await sb.from('payments').select('client_key,fecha,numero_recibo,monto').order('fecha',{ascending:false}).limit(5000);
  if(error) throw error;
  const map = new Map();
  for(const p of (data||[])){
    if(!map.has(p.client_key)) map.set(p.client_key, []);
    const arr = map.get(p.client_key);
    if(arr.length<3) arr.push({fecha: p.fecha? new Date(p.fecha): null, numeroRecibo:p.numero_recibo, monto:p.monto});
  }
  return map;
}

const CG_C2B_PESOS = 'Exclusivamente en pesos argentinos. Los gastos incurridos por el Dador de conformidad con este Contrato serán reembolsados por el Tomador en dicha moneda.';

function cgEsc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* Escapa y convierte \t y \n en etiquetas de Word (el token vive dentro de un <w:t>) */
function cgTxt(s){
  return cgEsc(s).replace(/\t/g,'</w:t><w:tab/><w:t xml:space="preserve">').replace(/\n/g,'</w:t><w:br/><w:t xml:space="preserve">');
}
function cgParseNum(s){
  if(typeof s==='number') return isFinite(s)?s:NaN;
  let t=String(s==null?'':s).replace(/USD|U\$S|US\$|\$|\s/gi,'');
  if(!t) return NaN;
  const hasC=t.indexOf(',')>=0, hasD=t.indexOf('.')>=0;
  if(hasC && hasD) t=t.replace(/\./g,'').replace(',','.');
  else if(hasC) t=t.replace(',','.');
  else if(hasD && /^-?\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,'');
  const n=Number(t);
  return isFinite(n)?n:NaN;
}
function cgFmtNum(n,dec){
  if(dec==null) dec=2;
  if(!isFinite(n)) return '';
  const neg=n<0; const fixed=Math.abs(n).toFixed(dec);
  let [i,f]=fixed.split('.');
  i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (neg?'-':'')+i+(f?','+f:'');
}
function cgMoneda(d){ return d.moneda==='USD' ? 'Dólares Estadounidenses' : 'Pesos Argentinos'; }
/* Importe con el símbolo del contrato: USD 18.917,35-.  /  $5.542.669,68-. */
function cgImporte(d,val,sufijo){
  const n=cgParseNum(val);
  if(!isFinite(n)) return '';
  const num=cgFmtNum(n,2);
  const base = d.moneda==='USD' ? 'USD '+num : '$'+num;
  return base+'-.'+(sufijo||'');
}
function cgFechaCorta(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');
  return m? m[3]+'/'+m[2]+'/'+m[1] : '';
}
const CG_MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function cgFechaLarga(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');
  return m? (+m[3])+' de '+CG_MESES[+m[2]-1]+' de '+m[1] : '';
}
function cgTasaPct(v){
  const n=cgParseNum(v); if(!isFinite(n)) return '';
  return cgFmtNum(n, Math.abs(n-Math.round(n))<1e-9?0:2).replace(/,00$/,'');
}
/* Textos de tasa derivados del tipo de canon (el usuario puede corregirlos después) */
function cgTasasDefault(d){
  if(d.canonVar==='SI'){
    const ref=(d.refTasa||'TAMAR'); const sp=cgTasaPct(d.spread);
    const base=ref+' más '+sp+'%pp';
    return { tasaRef:base, spread:'+'+sp+'%', tasaFinal:CG_TASA_FINAL_VAR, tasaBaseVar:base, tasaBaseAplicada:'NO APLICA' };
  }
  const tf=cgTasaPct(d.tasaFija);
  return { tasaRef:'No Aplica', spread:'No Aplica', tasaFinal:'No Aplica', tasaBaseVar:'No Aplica', tasaBaseAplicada: tf?('TNA '+tf+'%'):'TNA' };
}
function cgNombre(d){ return String(d.nombre||'').trim().toUpperCase(); }
/* Mapa token -> valor para el Word */
function cgTokens(d, anexo){
  const year=new Date().getFullYear();
  const blankDate='      /      /'+year;
  const nombre=cgNombre(d);
  const pj = d.tipo==='PJ';
  const dad={ nombre:d.dadorNombre, firma:d.dadorFirma, dni:d.dadorDni, caracter:d.dadorCaracter };
  let intro, l1, l2;
  if(pj){
    intro = nombre+', CUIT '+String(d.doc||'').trim()+', representada en este acto por '+String(d.repNombre||'').trim().toUpperCase()+', DNI '+String(d.repDni||'').trim()+', en carácter de '+String(d.repCaracter||'').trim();
    l1 = 'p/'+nombre;
    l2 = String(d.repNombre||'').trim().toUpperCase()+'\nDNI: '+String(d.repDni||'').trim();
  } else {
    intro = nombre+', DNI '+String(d.doc||'').trim();
    l1 = nombre;
    l2 = 'DNI: '+String(d.doc||'').trim();
  }
  const tasas={ ...cgTasasDefault(d), ...(d.tasasEdit||{}) };
  const fCal = cgFechaCorta(d.fechaCal) || blankDate;
  const fCon = cgFechaCorta(d.fechaContrato) || blankDate;
  const fFirma = d.fechaFirma ? ('el '+cgFechaLarga(d.fechaFirma)+'.') : ('el          de \t\t        de '+year+'.    ');
  const t={
    TOMADOR_INTRO: intro,
    TOMADOR_DOMICILIO: String(d.domicilio||'').trim(),
    TOMADOR_NOMBRE: nombre,
    DADOR_REP_INTRO: (dad.nombre||'')+', DNI '+(dad.dni||'')+', en carácter de '+(dad.caracter||''),
    DADOR_FIRMA_NOMBRE: dad.firma||'',
    DADOR_FIRMA_DNI: 'DNI: '+(dad.dni||''),
    FIRMA_L1: l1, FIRMA_L2: l2,
    NRO: String(d.nro||'').trim(),
    FECHA_CAL: fCal, FECHA_CONTRATO: fCon, FECHA_FIRMA: fFirma,
    PROVEEDOR: String(d.proveedor||'').trim(),
    LUGAR_ENTREGA: String(d.lugarEntrega||'').trim(),
    LUGAR_RADICACION: String(d.lugarRadicacion||'').trim(),
    MONEDA_NOMBRE: cgMoneda(d),
    DEPOSITO: cgImporte(d,d.deposito),
    COMISION: cgImporte(d,d.comision,' (+ IVA)'),
    SELLOS: cgImporte(d,d.sellos),
    C2B: (d.moneda==='ARS' && d.c2bModo==='pesos') ? CG_C2B_PESOS : CG_C2B_USD,
    CANON_VAR: d.canonVar==='SI'?'SI':'NO',
    TASA_REF: tasas.tasaRef, SPREAD: tasas.spread, TASA_FINAL: tasas.tasaFinal,
    TASA_BASE_VAR: tasas.tasaBaseVar, TASA_BASE_APLICADA: tasas.tasaBaseAplicada,
    TASA_CANCELACION: d.tasaCancelacion||CG_TEXTO_CANCELACION,
    TASA_PUNITORIA: d.tasaPunitoria||CG_TEXTO_PUNITORIA,
    MARCA: String(d.marca||'').trim(), MODELO: String(d.modelo||'').trim(),
    MOTOR: String(d.motor||'').trim(), CHASIS: String(d.chasis||'').trim()
  };
  return t;
}

/* ---------- Anexo I desde Excel ---------- */
function cgNorm(s){ return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); }
function cgSerialToDate(v){
  const ms=Date.UTC(1899,11,30)+Math.round(v)*86400000; const dt=new Date(ms);
  const dd=String(dt.getUTCDate()).padStart(2,'0'), mm=String(dt.getUTCMonth()+1).padStart(2,'0'), yy=String(dt.getUTCFullYear()).slice(-2);
  return dd+'/'+mm+'/'+yy;
}
/* rows: array de arrays con number | string | null. Las fechas ya vienen como 'dd/mm/aa' (texto) o como serial numérico en col 0 */
function cgParseAnexo(rows, simbolo){
  const sym=(simbolo==null||simbolo==='')?'$':simbolo;
  const res={ ok:false, error:'', header:null, body:[], meta:{}, aviso:[] };
  let hi=-1, c0=-1;
  for(let i=0;i<rows.length;i++){
    const r=rows[i]||[];
    for(let c=0;c<r.length;c++){
      if(cgNorm(r[c]).startsWith('vencimiento') && cgNorm(r[c+1]).startsWith('concepto')){ hi=i; c0=c; break; }
    }
    if(hi>=0) break;
  }
  if(hi<0){ res.error='No encontré la fila de títulos (Vencimiento | Concepto | Importe | Caída de capital | Caída de interés) en el Excel.'; return res; }
  const hr=rows[hi];
  res.header=[0,1,2,3,4].map(k=>String(hr[c0+k]==null?'':hr[c0+k]).trim());
  if(!res.header[2]) res.header[2]='Importe s/ IVA';
  if(!res.header[3]) res.header[3]='Caída de capital';
  if(!res.header[4]) res.header[4]='Caída de interés';
  // metadatos de las filas de arriba
  for(let i=0;i<hi;i++){
    const r=(rows[i]||[]).map(v=>v==null?'':String(v).trim());
    for(let c=0;c<r.length;c++){
      const n=cgNorm(r[c]);
      const nextVal=()=>{ for(let k=c+1;k<r.length;k++){ if(r[k]) return r[k]; } return ''; };
      if(/^contrato\s*n/.test(n)){ const m=/[:\s]\s*([^\s:]+)\s*$/.exec(r[c]); const v=(r[c].split(':')[1]||'').trim() || nextVal(); if(v) res.meta.nro=v; }
      else if(/^cliente/.test(n)){ const v=(r[c].split(':')[1]||'').trim() || nextVal(); if(v) res.meta.cliente=v; }
      else if(/^cui[lt]/.test(n)){ const v=(r[c].split(':')[1]||'').trim() || nextVal(); if(v){ res.meta.doc=v; res.meta.docLabel=/^cuit/.test(n)?'Cuit':'Cuil'; } }
    }
  }
  const fmtMoney=(v,noSym)=>{
    if(v==null||v==='') return '';
    if(typeof v==='number') return (noSym?'':sym+' ')+cgFmtNum(v,2);
    return String(v);
  };
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]||[];
    const cells=[0,1,2,3,4].map(k=>r[c0+k]);
    if(cells.every(v=>v==null||String(v).trim()==='')) continue;
    let [a,b,c,d,e]=cells;
    let aS = (typeof a==='number' && a>20000 && a<80000) ? cgSerialToDate(a) : (a==null?'':String(a).trim());
    const concepto = b==null?'':b;
    const noSym = (aS===''&&(b==null||String(b).trim()===''));            // fila de totales
    const esPlazo = typeof concepto==='string' && /plazo/.test(cgNorm(concepto));
    let bS = typeof concepto==='number' ? String(Math.round(concepto)===concepto?concepto:cgFmtNum(concepto,2)) : String(concepto).trim();
    let cS = esPlazo ? (typeof c==='number'?String(c):String(c==null?'':c)) : fmtMoney(c,noSym);
    res.body.push([aS,bS,cS,fmtMoney(d,noSym),fmtMoney(e,noSym)]);
  }
  if(!res.body.length){ res.error='Encontré los títulos pero no hay filas debajo.'; return res; }
  // cantidad de cuotas = filas cuyo concepto es un número
  res.cuotas = res.body.filter(r=>/^\d+$/.test(r[1])).length;
  res.ok=true; return res;
}
/* Tamaño de letra y alto de fila para que todo el Anexo I entre en una sola hoja */
function cgAnexoLayout(nBody){
  const rowsTotal = nBody + 3;                      // + título, cliente y encabezado
  const AVAIL = CG_ANEXO_AVAIL;                     // alto útil (dxa) que queda para la tabla en la hoja
  // 1) como el original: 8 pt con filas de 227 dxa
  if(rowsTotal*227 <= AVAIL) return { pt:8, rowH:227, sz:16, rowsTotal, overflow:false };
  // 2) si no entra, se achica la letra (filas más compactas) hasta un mínimo legible de 6 pt
  for(let pt=8; pt>=6; pt-=0.5){
    const h=Math.round(pt*20*1.22);
    if(rowsTotal*h <= AVAIL) return { pt, rowH:h, sz:Math.round(pt*2), rowsTotal, overflow:false };
  }
  const h=Math.round(6*20*1.22);
  return { pt:6, rowH:h, sz:12, rowsTotal, overflow:true };
}
let CG_ANEXO_AVAIL = 9870;
function cgAnexoTableXml(d, anexo){
  const L=cgAnexoLayout(anexo.body.length);
  const FONT='<w:rFonts w:ascii="Aptos Display" w:hAnsi="Aptos Display" w:cs="Aptos Display"/>';
  const W=[1500,1750,1800,1800,1800];                  // 8650 dxa, centrada
  const TW=W.reduce((a,b)=>a+b,0);
  const bd='<w:top w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:left w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:right w:val="single" w:sz="4" w:space="0" w:color="000000"/>';
  const cell=(txt,w,o)=>{
    o=o||{};
    const span=o.span?'<w:gridSpan w:val="'+o.span+'"/>':'';
    const shd=o.shade?'<w:shd w:val="clear" w:color="auto" w:fill="'+o.shade+'"/>':'';
    const rp='<w:rPr>'+FONT+(o.bold?'<w:b/><w:bCs/>':'')+'<w:color w:val="000000"/><w:sz w:val="'+L.sz+'"/><w:szCs w:val="'+L.sz+'"/><w:lang w:val="es-AR"/></w:rPr>';
    return '<w:tc><w:tcPr><w:tcW w:w="'+w+'" w:type="dxa"/>'+span+'<w:tcBorders>'+bd+'</w:tcBorders>'+shd+'<w:vAlign w:val="center"/></w:tcPr>'+
      '<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:jc w:val="'+(o.al||'left')+'"/>'+rp+'</w:pPr>'+
      (txt===''?'':'<w:r>'+rp+'<w:t xml:space="preserve">'+cgEsc(txt)+'</w:t></w:r>')+'</w:p></w:tc>';
  };
  const row=cells=>'<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="'+L.rowH+'" w:hRule="exact"/></w:trPr>'+cells.join('')+'</w:tr>';
  const rows=[];
  rows.push(row([cell('Anexo I',W[0],{bold:1}), cell('Contrato Nº: '+String(d.nro||'').trim(),W[1]+W[2]+W[3]+W[4],{bold:1,span:4})]));
  const docLabel = d.tipo==='PJ'?'Cuit':'Cuil';
  rows.push(row([cell('Cliente:',W[0],{}), cell(String(d.nombre||'').trim(),W[1]+W[2],{span:2,al:'left'}), cell(docLabel+':',W[3],{al:'right'}), cell(String(d.docAnexo||d.doc||'').trim(),W[4],{al:'left'})]));
  rows.push(row(anexo.header.map((h,i)=>cell(h,W[i],{bold:1,al:'center',shade:'D9D9D9'}))));
  anexo.body.forEach((r,ri)=>{
    const isTot = r[0]==='' && r[1]==='';
    const isRes = /residual/i.test(r[1]);
    rows.push(row([
      cell(r[0],W[0],{al:'center',bold:isTot}),
      cell(r[1],W[1],{al:'center',bold:isTot||isRes}),
      cell(r[2],W[2],{al:'right',bold:isTot||isRes}),
      cell(r[3],W[3],{al:'right',bold:isTot||isRes}),
      cell(r[4],W[4],{al:'right',bold:isTot||isRes})
    ]));
  });
  return '<w:tbl><w:tblPr><w:tblW w:w="'+TW+'" w:type="dxa"/><w:jc w:val="center"/><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="70" w:type="dxa"/><w:right w:w="70" w:type="dxa"/></w:tblCellMar><w:tblLook w:val="04A0" w:firstRow="1" w:lastRow="0" w:firstColumn="1" w:lastColumn="0" w:noHBand="0" w:noVBand="1"/></w:tblPr>'+
    '<w:tblGrid>'+W.map(w=>'<w:gridCol w:w="'+w+'"/>').join('')+'</w:tblGrid>'+rows.join('')+'</w:tbl>';
}
function toTitle(s){ return String(s||'').trim().toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()); }

/* ---------- Validación ---------- */
function cgValidar(d, anexo){
  const errores=[], avisos=[];
  const need=(v,msg)=>{ if(!String(v==null?'':v).trim()) errores.push(msg); };
  need(d.nombre, d.tipo==='PJ'?'Falta la razón social del Tomador.':'Falta el nombre y apellido del Tomador.');
  need(d.doc, d.tipo==='PJ'?'Falta el CUIT de la empresa.':'Falta el DNI del Tomador.');
  need(d.domicilio,'Falta el domicilio del Tomador.');
  if(d.tipo==='PJ'){ need(d.repNombre,'Falta el nombre del representante de la empresa.'); need(d.repDni,'Falta el DNI del representante.'); need(d.repCaracter,'Falta el carácter del representante (Presidente, Socio Gerente, Apoderado…).'); }
  need(d.nro,'Falta el número de contrato.');
  need(d.proveedor,'Falta el proveedor.'); need(d.lugarEntrega,'Falta el lugar de entrega.');
  need(d.marca,'Falta la marca del vehículo.'); need(d.modelo,'Falta el modelo del vehículo.');
  if(!isFinite(cgParseNum(d.deposito))) errores.push('Falta el monto del depósito en garantía (número).');
  if(!isFinite(cgParseNum(d.comision))) errores.push('Falta el monto de la comisión de estructuración (número).');
  if(!isFinite(cgParseNum(d.sellos))) errores.push('Falta el valor económico para el Impuesto de Sellos (número).');
  if(d.canonVar==='SI'){ if(!isFinite(cgParseNum(d.spread))) errores.push('Canon variable: falta el spread (por ejemplo 11).'); }
  else if(!isFinite(cgParseNum(d.tasaFija))) errores.push('Canon fijo: falta la tasa TNA (por ejemplo 14).');
  need(d.dadorNombre,'Falta el nombre del firmante por el Dador.');
  if(!anexo||!anexo.ok) errores.push('Falta cargar el Excel del Anexo I (valores presupuestados).');
  else {
    const L=cgAnexoLayout(anexo.body.length);
    if(L.overflow) errores.push('El Anexo I tiene demasiadas filas ('+anexo.body.length+') para entrar en una hoja con letra legible.');
    if(anexo.meta.nro && d.nro && String(anexo.meta.nro).trim()!==String(d.nro).trim()) avisos.push('El Excel dice Contrato Nº '+anexo.meta.nro+' pero en el formulario cargaste '+d.nro+'. En el Word se usa el del formulario.');
    if(anexo.meta.doc && d.doc){ const a=String(anexo.meta.doc).replace(/\D/g,''), b=String(d.doc).replace(/\D/g,''); if(a && b && !a.includes(b) && !b.includes(a)) avisos.push('El CUIL/CUIT del Excel ('+anexo.meta.doc+') no coincide con el documento del formulario ('+d.doc+').'); }
  }
  if(!d.fechaCal) avisos.push('Sin fecha del CAL: quedará en blanco para completar a mano.');
  if(!d.fechaFirma) avisos.push('Sin fecha de firma: quedará en blanco para completar a mano.');
  if(d.moneda==='ARS' && d.c2bModo!=='pesos') avisos.push('Contrato en pesos: la cláusula 2(B) (pagos “exclusivamente en dólares”) queda igual que en tu modelo. Revisala con tu abogado.');
  return { errores, avisos };
}

/* ---------- Armado del .docx ---------- */
async function cgGenerarDocx(JSZipLib, templateB64, d, anexo){
  const zip=await JSZipLib.loadAsync(templateB64,{base64:true});
  let xml=await zip.file('word/document.xml').async('string');
  const tk=cgTokens(d,anexo);
  xml=xml.replace(/\{\{([A-Z_0-9]+)\}\}/g,(m,k)=>{
    if(!(k in tk)) throw new Error('Falta el dato para el campo '+k);
    return cgTxt(tk[k]);
  });
  xml=xml.replace('[[[ANEXO_TABLE]]]',()=>cgAnexoTableXml(d,anexo));
  zip.file('word/document.xml',xml);
  // metadatos limpios
  const core=zip.file('docProps/core.xml');
  return zip.generateAsync({type:'uint8array',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

/* Lee una hoja de SheetJS y devuelve filas con fechas ya convertidas */
function cgSheetRows(XLSX, ws){
  if(!ws||!ws['!ref']) return [];
  const rg=XLSX.utils.decode_range(ws['!ref']); const rows=[];
  for(let r=rg.s.r;r<=rg.e.r;r++){
    const row=[];
    for(let c=rg.s.c;c<=rg.e.c;c++){
      const cell=ws[XLSX.utils.encode_cell({r,c})];
      if(!cell||cell.v==null||cell.v===''){ row.push(null); continue; }
      if(cell.t==='n'){
        if(cell.z && XLSX.SSF.is_date(cell.z)) row.push(cgSerialToDate(cell.v)); else row.push(cell.v);
      } else if(cell.t==='d'){
        const dt=cell.v; row.push(String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+String(dt.getFullYear()).slice(-2));
      } else row.push(String(cell.v));
    }
    rows.push(row);
  }
  return rows;
}

}
function cgInit(){
  const st={ d:cgBlankData(), rows:null, anexo:null, anexoFile:'', modo:'form', busy:false, anexoError:'', agendaId:'' };
  try{
    const raw=localStorage.getItem(CG_LS_KEY);
    if(raw){
      const o=JSON.parse(raw);
      if(o && o.d){
        st.d=Object.assign(cgBlankData(),o.d);
        if(Array.isArray(o.rows)){ st.rows=o.rows; st.anexoFile=o.anexoFile||''; const a=cgParseAnexo(o.rows,st.d.simbolo); if(a.ok) st.anexo=a; }
      }
    }
  }catch(e){}
  return st;
}

  try{ localStorage.setItem(CG_LS_KEY, JSON.stringify({ d:state.cg.d, rows:state.cg.rows, anexoFile:state.cg.anexoFile })); }catch(e){}
}
function cgReparse(){
  if(!state.cg.rows){ state.cg.anexo=null; return; }
  const a=cgParseAnexo(state.cg.rows, state.cg.d.simbolo);
  state.cg.anexo = a.ok ? a : null; state.cg.anexoError = a.ok ? '' : a.error;
}
function cgSumaCuotas(){
  const a=state.cg.anexo; if(!a) return NaN;
  let s=0,n=0;
  a.body.forEach(r=>{ if(/^\d+$/.test(r[1])){ const v=cgParseNum(r[2]); if(isFinite(v)){ s+=v; n++; } } });
  return n? Math.round(s*100)/100 : NaN;
}
function cgAplicarAgenda(id){
  const c=state.contratos.find(x=>String(x.id)===String(id)); if(!c) return;
  const d=state.cg.d;
  d.nombre=c.cliente||d.nombre; d.marca=c.veh_marca||d.marca; d.modelo=c.veh_modelo||d.modelo;
  if(c.tipo_tasa==='Variable'){ d.canonVar='SI'; d.refTasa=String(c.tasa_base||'Tamar').toUpperCase(); d.spread=c.tasa_interes==null?'':String(c.tasa_interes).replace('.',','); }
  else { d.canonVar='NO'; d.tasaFija=c.tasa_interes==null?'':String(c.tasa_interes).replace('.',','); }
  d.tasasEdit=null; state.cg.agendaId=String(id); cgSave();
}
async function cgCargarExcel(file){
  state.cg.anexoError=''; state.error='';
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    let found=null, lastErr='';
    for(const name of wb.SheetNames){
      const rows=cgSheetRows(XLSX, wb.Sheets[name]);
      const a=cgParseAnexo(rows, state.cg.d.simbolo);
      if(a.ok){ found={rows,a}; break; } else lastErr=a.error;
    }
    if(!found){ state.cg.anexoError=lastErr||'No pude leer el Excel.'; render(); return; }
    state.cg.rows=found.rows; state.cg.anexo=found.a; state.cg.anexoFile=file.name;
    const d=state.cg.d, m=found.a.meta;
    if(!d.nro && m.nro) d.nro=String(m.nro);
    if(!d.nombre && m.cliente) d.nombre=m.cliente;
    if(!d.doc && m.doc) d.doc=m.doc;
    cgSave();
  }catch(e){ state.cg.anexoError='No pude leer el archivo: '+((e&&e.message)||e); }
  render();
}
async function cgBuild(){
  if(!(window.JSZip)) throw new Error('No se cargó la librería para armar el Word (revisá tu conexión a internet y recargá la página).');
  return cgGenerarDocx(window.JSZip, CG_TEMPLATE_B64, state.cg.d, state.cg.anexo);
}
function cgNombreArchivo(){
  const d=state.cg.d;
  return 'Contrato_Leasing_'+sanitizeFilename(String(d.nro||'s-n')+'_'+String(d.nombre||'Cliente').trim().replace(/\s+/g,'_'))+'.docx';
}
function cgDescargarBytes(bytes, filename){
  const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}
async function cgDescargar(){
  const v=cgValidar(state.cg.d,state.cg.anexo);
  if(v.errores.length){ state.error='Faltan datos para armar el contrato (mirá el cuadro "Controles").'; state.notice=''; state.cg.modo='form'; render(); return; }
  try{ const bytes=await cgBuild(); cgLastBytes=bytes; cgDescargarBytes(bytes,cgNombreArchivo()); state.notice='Descargué '+cgNombreArchivo(); state.error=''; }
  catch(e){ state.error='No pude armar el Word: '+((e&&e.message)||e); state.notice=''; }
  render();
}
async function cgAbrirPreview(){
  const v=cgValidar(state.cg.d,state.cg.anexo);

  state.error=''; state.notice=''; state.cg.modo='preview'; render(); window.scrollTo(0,0);
}
async function cgRenderPreview(){
  const host=document.getElementById('cg-preview-host'); if(!host) return;
  host.innerHTML='<div class="empty"><span class="spin">⟳</span> Armando la vista previa...</div>';
  try{
    const bytes=await cgBuild(); cgLastBytes=bytes;
    if(!(window.docx && window.docx.renderAsync)) throw new Error('No se cargó el visor de vista previa (revisá tu conexión). Igual podés descargar el Word.');
    host.innerHTML='';
    await window.docx.renderAsync(new Blob([bytes]), host, null, { className:'docx', inWrapper:true, ignoreWidth:false, ignoreHeight:false, breakPages:true, renderHeaders:true, renderFooters:true, useBase64URL:true });
    const z=document.getElementById('cg-zoom'); if(z) host.style.zoom=z.value;
  }catch(e){

function cgOnClick(action, btn){
  const cg=state.cg, d=cg.d;
  if(action==='cg-set'){
    d[btn.dataset.field]=btn.dataset.value;
    if(btn.dataset.field==='canonVar') d.tasasEdit=null;
    if(btn.dataset.field==='moneda' && d.moneda==='USD') d.c2bModo='mantener';
    cgSave(); cgRender();
  } else if(action==='cg-sellos-suma'){
    const s=cgSumaCuotas(); if(isFinite(s)){ d.sellos=cgFmtNum(s,2); cgSave(); cgRender(); }
  } else if(action==='cg-preview'){ cgAbrirPreview();
  } else if(action==='cg-download'){ cgDescargar();
  } else if(action==='cg-volver'){ cg.modo='form'; cgRender();
  } else if(action==='cg-limpiar'){
    if(!confirm('¿Empezar un contrato nuevo? Se borran los datos cargados en este formulario.')) return;
    try{ localStorage.removeItem(CG_LS_KEY); }catch(e){}
    state.cg=cgInit(); state.cg.d=cgBlankData(); state.cg.rows=null; state.cg.anexo=null; state.cg.anexoFile=''; state.error=''; state.notice=''; render(); window.scrollTo(0,0);
  }
}

  const el=e.target, d=state.cg.d;
  if(el.id==='cg-anexo-file'){ if(el.files[0]) cgCargarExcel(el.files[0]); return true; }
  if(el.id==='cg-agenda'){ if(el.value){ cgAplicarAgenda(el.value); cgRender(); } return true; }
  if(el.id==='cg-zoom'){ const h=document.getElementById('cg-preview-host'); if(h) h.style.zoom=el.value; return true; }
  if(el.classList.contains('cg-field')){
    const f=el.dataset.field;

      d[f]=el.value;
      if(f==='dadorKey' && CG_DADORES[el.value]){ const p=CG_DADORES[el.value]; d.dadorNombre=p.nombre; d.dadorFirma=p.firma; d.dadorDni=p.dni; d.dadorCaracter=p.caracter; }

      cgSave(); cgRender();

    return true;
  }
  return false;
}

function deltaChipHtml(curr, prev, small){
  const cls = small ? 'chip chip-sm' : 'chip';
  if(prev==null) return '<span class="'+cls+' muted">− sin dato previo</span>';
  const diff = curr - prev;
  if(Math.abs(diff) < 0.5) return '<span class="'+cls+' muted">− sin cambios</span>';
  const up = diff > 0;
  return '<span class="'+cls+' '+(up?'danger':'success')+'">'+(up?'▲':'▼')+' '+(up?'+':'-')+esc(money(Math.abs(diff)))+'</span>';
}

// ---------- informe de cuotas por gerencia (agrupado por Grupo, discriminando
// líneas cuando los planes de un mismo grupo no tienen las mismas cuotas) ----------
function computeCuotasReport(gerencia){
  const clientesFiltrados = state.clients.filter(c=> c.contracts.some(ct=>ct.gerencia===gerencia));
  const items = clientesFiltrados.map(c=>{
    const contratos = c.contracts.filter(ct=>ct.gerencia===gerencia);
    const groups = new Map();
    for(const ct of contratos){
      const g = normGrupo(ct.grupo);
      const key = g+'||'+ct.totalPagadas+'||'+ct.totalAdeudado;
      if(!groups.has(key)) groups.set(key, {grupo:g, pagadas:ct.totalPagadas, vencidas:ct.totalAdeudado, count:0, deudaVencida:0, deudaAVencer:0});
      const row = groups.get(key);
      row.count += 1;
      row.deudaVencida += ct.valorTotalImpago;
      row.deudaAVencer += ct.valorTotalPrecancelable;
    }
    let faltaPlan = false;
    const rows = Array.from(groups.values()).sort((a,b)=>
      a.grupo.localeCompare(b.grupo, undefined, {numeric:true}) || b.pagadas-a.pagadas
    );
    rows.forEach(r=>{
      const totalPlan = state.planCuotas.get(r.grupo);
      if(totalPlan==null){ r.aVencer = null; faltaPlan = true; }
      else r.aVencer = totalPlan - r.pagadas - r.vencidas;
    });
    return {
      clientName: c.displayName, clientKey: c.key, rows,
      totalCirculos: contratos.length,
      totalDeudaVencida: contratos.reduce((s,ct)=>s+ct.valorTotalImpago,0),
      totalDeudaAVencer: contratos.reduce((s,ct)=>s+ct.valorTotalPrecancelable,0),
      faltaPlan
    };
  });
  items.sort((a,b)=>a.clientName.localeCompare(b.clientName));
  return items;
}

const NAME_STOPWORDS = new Set(['SA','SRL','SAS','SACIYF','SACI','SATACI','CIA','DE','DEL','LA','EL','LOS','LAS','Y','SPA']);
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(m===0) return n; if(n===0) return m;
  const dp = [];
  for(let i=0;i<=m;i++) dp.push(new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
// busca el/los clientes que mejor matchean con lo que se preguntó, tolerando
// errores de tipeo y que falten palabras (S.A., S.R.L., etc no cuentan)
// en español "b" y "v" suenan igual, y al hablar (sobre todo por reconocimiento
// de voz) también se confunden con "p" (son todos sonidos labiales parecidos);
// las tratamos como intercambiables al comparar
function phoneticKey(w){ return w.replace(/[VP]/g,'B'); }
function squish(s){ return s.replace(/ /g,''); }

function findClientMatches(queryNorm, clients){
  const queryWords = queryNorm.split(' ').filter(w=>w.length>1);
  // para la comparación "sin espacios" solo nos importan las palabras que
  // podrían ser parte de un nombre, no toda la frase (si no, "cuántos
  // círculos tiene X" nunca iba a coincidir con nada)
  const leftoverForSquish = queryWords.filter(w=>!FOLLOWUP_FILLER.has(w));
  const qSquish = squish(leftoverForSquish.join(' '));
  const scored = clients.map(c=>{
    const nameNorm = normName(c.displayName);
    let score = 0;
    if(nameNorm && (queryNorm.includes(nameNorm) || phoneticKey(queryNorm).includes(phoneticKey(nameNorm)))){
      score = 100;
    } else {
      const nameWords = Array.from(new Set(nameNorm.split(' ').filter(w=>w.length>2 && !NAME_STOPWORDS.has(w))));
      if(nameWords.length===1){
        // una sola palabra distintiva: sin tolerancia a errores de tipeo,
        // pero sí toleramos la confusión b/v (muy común al hablar y transcribir)
        const nw = nameWords[0];
        score = queryWords.some(qw => qw===nw || phoneticKey(qw)===phoneticKey(nw)) ? 50 : 0;
      } else if(nameWords.length>1){
        // una coincidencia EXACTA de una palabra clave (ej. "ERSA") ya es señal fuerte,
        // aunque falten otras palabras del nombre completo; una coincidencia aproximada
        // (typo) pesa menos para no confundir nombres parecidos por casualidad
        let weighted = 0, matchedCount = 0;
        for(const nw of nameWords){
          if(queryWords.includes(nw)){ weighted += 1; matchedCount++; }
          else if(queryWords.some(qw => phoneticKey(qw)===phoneticKey(nw))){ weighted += 0.9; matchedCount++; }
          else if(queryWords.some(qw => levenshtein(qw,nw) <= Math.max(1, Math.floor(nw.length*0.25)))){
            weighted += 0.5; matchedCount++;
          }
        }
        const fullMatch = matchedCount === nameWords.length;
        score = Math.min(95, weighted*35 + (fullMatch?10:0));
      }
      // "sin espacios": cubre el caso de un nombre real con espacio ("SUPER MAX")
      // contra una consulta escrita/hablada toda junta ("supermax"), o al revés
      const nSquish = squish(nameNorm.split(' ').filter(w=>!NAME_STOPWORDS.has(w)).join(' '));
      if(nSquish.length>=5 && qSquish.length>=5 && (nSquish.includes(qSquish) || qSquish.includes(nSquish))){
        score = Math.max(score, 85);
      }
    }
    return {client:c, score};
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored.filter(s=>s.score>=35);
}

// palabras "de relleno" o de intención (no cuentan como intento de nombrar a alguien)
const FOLLOWUP_FILLER = new Set(['QUE','Y','O','CUANTO','CUANTOS','CUANTA','CUANTAS','TIENE','TIENEN','TENGO','TENES','TENEMOS','ES','SON','ERA','ERAN',
  'ESTA','ESTAN','ESTOY','ESTAS','ESTAMOS','FUE','FUERON','SERA','SERAN','HAY','LA','EL','LOS','LAS','DE','DEL',
  'UN','UNA','UNOS','UNAS','ESE','ESA','ESOS','ESAS','ESTE','ESTA','ESTOS','ESTAS','ESO','ESTO','MISMO','MISMA',
  'TAMBIEN','AHORA','ME','TE','SE','NOS','DECIS','DECI','DECIME','DIME','PODES','PODRIAS','MOSTRAME','MOSTRAR','DAME',
  'QUIERO','QUISIERA','NECESITO','CONTAME','SOBRE','RESPECTO','ACERCA','DEBE','DEBEN','CUAL','CUALES','QUIEN','QUIENES',
  'PAGO','PAGOS','PAGA','PAGAS','PAGADAS','PAGADO','RECIBO','RECIBOS','ABONO','ABONOS','COBRO','COBROS','DEUDA','DEUDAS',
  'VENCID','VENCIDA','VENCIDAS','VENCIDO','VENCIDOS','ULTIMO','ULTIMOS','ULTIMA','ULTIMAS','PRIMERO','PRIMEROS','PRIMERA',
  'CIRCULO','CIRCULOS','CONTRATO','CONTRATOS','PLAN','PLANES','ESTADO','ADJUDICADO','ADJUDICADOS','AGRUPADO','AGRUPADOS',
  'AUMENTO','AUMENTA','INCREMENTO','SUBIO','BAJO','DISMINUYO','REDUJO','VARIACION','CAMBIO','CUOTA','CUOTAS','IMPAGA','IMPAGAS',
  'A','VENCER','POR','FAVOR','BIEN','OK','DALE','ENTONCES','BUENO','CLARO','OSEA',
  'EN','CON','SIN','PARA','ENTRE','DESDE','HASTA','SEGUN','TOTAL','ACUMULADO','ACUMULADA','SUMA']);
// si quedan 2+ palabras "sueltas" sin reconocer, o una sola pero larga (5+
// letras), asumimos que intentó nombrar a alguien nuevo (aunque no lo hayamos
// encontrado) — ahí NO conviene contestar sobre el cliente anterior, mejor
// avisar que no lo encontramos en vez de repetir una respuesta vieja
function looksLikeNameAttempt(queryNorm){
  const leftover = queryNorm.split(' ').filter(w=>w.length>1 && !FOLLOWUP_FILLER.has(w));
  if(leftover.length>=2) return true;
  if(leftover.length===1 && leftover[0].length>=5) return true;
  return false;
}

// ---------- asistente: preguntas sobre la pestaña Presupuesto ----------
const MESES_MAP = {ENERO:1,ENE:1,FEBRERO:2,FEB:2,MARZO:3,MAR:3,ABRIL:4,ABR:4,MAYO:5,MAY:5,JUNIO:6,JUN:6,
  JULIO:7,JUL:7,AGOSTO:8,AGO:8,SEPTIEMBRE:9,SETIEMBRE:9,SEP:9,SET:9,OCTUBRE:10,OCT:10,NOVIEMBRE:11,NOV:11,DICIEMBRE:12,DIC:12};
function isPresupuestoQuery(q){
  return /PRESUPUEST|FACTURA|EJECUCION|GASTO.*ADMINISTRATIV|ADMINISTRATIV.*GASTO/.test(q) || (/COBR/.test(q) && /BANC/.test(q));
}
function findMonthInQuery(q){
  const words = q.split(' ');
  let monthNum = null;
  for(const w of words){ if(MESES_MAP[w]){ monthNum = MESES_MAP[w]; break; } }
  if(!monthNum) return null;
  const months = getBudgetMonths();
  const yearMatch = q.match(/20\d\d/);
  if(yearMatch){
    const target = yearMatch[0]+'-'+String(monthNum).padStart(2,'0');
    return months.includes(target) ? target : null;
  }
  // sin año explícito: la ocurrencia más reciente de ese mes dentro de lo cargado
  const candidates = months.filter(m=> Number(m.split('-')[1])===monthNum);
  return candidates.length ? candidates[candidates.length-1] : null;
}
function generatePresupuestoAnswer(rawQuery){
  if(state.presupuestoData.size===0){
    return 'Todavía no tengo cargados los datos de presupuesto. Entrá un momento a la pestaña "Presupuesto" (o esperá unos segundos si la acabás de abrir) y volvé a preguntarme.';
  }
  const q = normName(rawQuery);
  const months = getBudgetMonths();
  const wantsTotal = /TOTAL|ACUMULAD|SUMA/.test(q);
  const monthFound = wantsTotal ? null : findMonthInQuery(q);

  const wantsFacturacionGastos = /FACTURA/.test(q) && /(GASTO|ADMINISTRATIV)/.test(q);
  const wantsFacturacionCuota = /FACTURA/.test(q) && !wantsFacturacionGastos;
  const wantsPresupuestoGastos = /PRESUPUEST/.test(q);
  const wantsGastosCobrados = /GASTO/.test(q) && /COBRAD/.test(q);
  const wantsCobranza = /COBR/.test(q) && !wantsGastosCobrados;
  const wantsEjecucion = /EJECUCION/.test(q);
  const anySpecific = wantsFacturacionGastos||wantsFacturacionCuota||wantsPresupuestoGastos||wantsCobranza||wantsGastosCobrados||wantsEjecucion;

  function sumField(field){ return months.reduce((s,m)=> s+((state.presupuestoData.get(m)||emptyPresupuestoRow())[field]||0), 0); }

  if(!monthFound){
    const parts = [];
    if(wantsFacturacionCuota || !anySpecific) parts.push('la facturación de cuota acumulada es de '+money(sumField('facturacionCuota')));
    if(wantsFacturacionGastos || !anySpecific) parts.push('la facturación de gastos administrativos acumulada es de '+money(sumField('facturacionGastosAdmin')));
    if(wantsPresupuestoGastos || !anySpecific) parts.push('el presupuesto de gastos administrativos acumulado es de '+money(sumField('presupuestoGastosAdmin')));
    if(wantsCobranza || !anySpecific) parts.push('la cobranza bancaria acumulada es de '+money(sumField('cobranzaBancaria')));
    if(wantsGastosCobrados || !anySpecific) parts.push('los gastos administrativos cobrados acumulados son de '+money(sumField('gastosAdminCobrados')));
    if(wantsEjecucion){
      const pres = sumField('presupuestoGastosAdmin'), cob = sumField('gastosAdminCobrados');
      parts.push('la ejecución acumulada del presupuesto de gastos administrativos es del '+(pres>0?(cob/pres*100).toFixed(1):'0')+'%');
    }
    const scope = wantsTotal ? ' (acumulado de todo el período cargado)' : ' (no identifiqué un mes puntual, te muestro el acumulado de todo el período cargado)';
    return 'Sobre el presupuesto'+scope+': '+joinNatural(parts)+'.';
  }

  const row = state.presupuestoData.get(monthFound) || emptyPresupuestoRow();
  const parts = [];
  if(wantsFacturacionCuota || !anySpecific) parts.push('la facturación de cuota fue de '+money(row.facturacionCuota));
  if(wantsFacturacionGastos || !anySpecific) parts.push('la facturación de gastos administrativos fue de '+money(row.facturacionGastosAdmin));
  if(wantsPresupuestoGastos || !anySpecific) parts.push('el presupuesto de gastos administrativos fue de '+money(row.presupuestoGastosAdmin));
  if(wantsCobranza || !anySpecific) parts.push('la cobranza bancaria fue de '+money(row.cobranzaBancaria));
  if(wantsGastosCobrados || !anySpecific) parts.push('los gastos administrativos cobrados fueron de '+money(row.gastosAdminCobrados));
  if(wantsEjecucion){
    const pct = row.presupuestoGastosAdmin>0 ? (row.gastosAdminCobrados/row.presupuestoGastosAdmin*100).toFixed(1) : '0';
    parts.push('la ejecución del presupuesto de gastos administrativos fue del '+pct+'%');
  }
  return 'En '+monthLabel(monthFound)+': '+joinNatural(parts)+'.';
}

function generateAnswer(rawQuery){
  if(!state.clients.length) return {text:'Todavía no hay datos cargados. Subí un archivo de deudores primero.', clientKey:null};
  const q = normName(rawQuery);
  if(!q) return {text:'No te escuché bien, ¿podés repetir la consulta?', clientKey:null};

  if(isPresupuestoQuery(q)){
    return {text: generatePresupuestoAnswer(rawQuery), clientKey:null};
  }

  const matches = findClientMatches(q, state.clients);
  let client = null;
  if(matches.length===0){
    if(state.chatLastClientKey && !looksLikeNameAttempt(q)){
      client = state.clients.find(c=>c.key===state.chatLastClientKey) || null;
    }
    if(!client) return {text:'No encontré ningún cliente que coincida con "'+rawQuery+'". ¿Podés repetir el nombre?', clientKey:null};
  } else {
    const top = matches[0];
    const close = matches.filter(m=>m!==top && m.score >= top.score-15);
    if(close.length>0 && top.score<95){
      const names = [top, ...close].slice(0,4).map(m=>m.client.displayName);
      return {text:'Encontré varios clientes parecidos: '+names.join(', ')+'. ¿Podés ser más específico?', clientKey:null};
    }
    client = top.client;
  }

  const totalImpago = client.contracts.reduce((s,c)=>s+c.valorTotalImpago,0);
  const totalPrecancelable = client.contracts.reduce((s,c)=>s+c.valorTotalPrecancelable,0);
  const totalCuotasVencidas = client.contracts.reduce((s,c)=>s+c.totalAdeudado,0);
  const totalCuotasPagas = client.contracts.reduce((s,c)=>s+c.totalPagadas,0);

  const wantsCuota = /CUOTA/.test(q);
  const wantsPagos = /PAGO|RECIBO|ABON|COBR/.test(q);
  const wantsVencida = /VENCID/.test(q) && !/A VENCER|POR VENCER/.test(q);
  const wantsAVencer = /A VENCER|POR VENCER/.test(q);
  const wantsCirculos = /CIRCULO|CONTRATO|PLAN(?!ILLA)/.test(q);
  const wantsEstado = /ADJUDICAD|AGRUPAD|ESTADO/.test(q);
  const wantsVariacion = /AUMENT|INCREMENT|SUBIO|SUBIÓ|BAJO|BAJÓ|DISMINUY|REDUJO|VARIACION|VARIACIÓN|CAMBIO|CAMBIÓ/.test(q);
  const anySpecific = wantsPagos||wantsVencida||wantsAVencer||wantsCirculos||wantsEstado||wantsVariacion||wantsCuota;

  const parts = [];
  if(wantsVencida || !anySpecific) parts.push('la deuda vencida es de '+money(totalImpago));
  if((wantsCuota && wantsVencida) || (wantsCuota && !wantsAVencer && !/PAGA/.test(q))) parts.push('tiene '+totalCuotasVencidas+' cuota'+(totalCuotasVencidas===1?'':'s')+' vencida'+(totalCuotasVencidas===1?'':'s')+' impaga'+(totalCuotasVencidas===1?'':'s'));
  if(wantsCuota && /PAGA/.test(q)) parts.push('lleva '+totalCuotasPagas+' cuota'+(totalCuotasPagas===1?'':'s')+' pagada'+(totalCuotasPagas===1?'':'s'));
  if(wantsAVencer || !anySpecific) parts.push('la deuda a vencer es de '+money(totalPrecancelable));
  if(wantsCirculos || !anySpecific) parts.push('tiene '+client.contracts.length+' círculo'+(client.contracts.length===1?'':'s'));
  if(wantsEstado){
    const adj = client.contracts.filter(c=>c.estado==='Adjudicado').length;
    const agr = client.contracts.filter(c=>c.estado==='Agrupado').length;
    parts.push('de esos, '+adj+' están Adjudicados y '+agr+' Agrupados');
  }
  if(wantsVariacion){
    const prev = clientPrevImpago(client.key);
    if(prev==null) parts.push('no tengo una foto anterior guardada para comparar');
    else{
      const diff = totalImpago - prev;
      if(Math.abs(diff)<0.5) parts.push('la deuda vencida no tuvo cambios desde la última carga');
      else if(diff>0) parts.push('la deuda vencida aumentó '+money(diff)+' desde la última carga');
      else parts.push('la deuda vencida bajó '+money(Math.abs(diff))+' desde la última carga');
    }
  }
  if(wantsPagos || !anySpecific){
    if(client.payments && client.payments.length){
      parts.push('los últimos pagos registrados son: '+client.payments.map(p=>shortDate(p.fecha)+' por '+money(p.monto)).join(', '));
    } else parts.push('no tiene pagos registrados');
  }
  return {text: 'Sobre '+client.displayName+': '+joinNatural(parts)+'.', clientKey: client.key};
}
function joinNatural(parts){
  if(parts.length===0) return 'no tengo más datos sobre esto';
  if(parts.length===1) return parts[0];
  return parts.slice(0,-1).join(', ')+' y '+parts[parts.length-1];
}

function getFilterOptions(){
  const estadoOpts = Array.from(new Set(state.clients.flatMap(c=>c.contracts.map(ct=>ct.estado)))).sort();
  const gerenciaOpts = Array.from(new Set(state.clients.flatMap(c=>c.contracts.map(ct=>ct.gerencia)))).sort();
  return {estadoOpts, gerenciaOpts};
}

function passesMinCuotas(ct){
  const min = Number(state.minCuotasAdeudadas);
  if(!state.minCuotasAdeudadas || isNaN(min)) return true;
  return ct.totalAdeudado >= min;
}
function getFilteredClients(){
  let list = state.clients.map(c=>{
    const contractsFiltered = c.contracts.filter(ct=> state.estadoFilter.has(ct.estado) && state.gerenciaFilter.has(ct.gerencia) && passesMinCuotas(ct));
    const totalImpago = contractsFiltered.reduce((s,x)=>s+x.valorTotalImpago,0);
    const totalPrecancelable = contractsFiltered.reduce((s,x)=>s+x.valorTotalPrecancelable,0);
    return Object.assign({}, c, {contractsFiltered, totalImpago, totalPrecancelable});
  }).filter(c=>c.contractsFiltered.length>0);

  if(state.search.trim()){
    const q = normName(state.search);
    list = list.filter(c=> normName(c.displayName).includes(q));
  }
  const dir = state.sortDir==='asc' ? 1 : -1;
  list.sort((a,b)=>{
    if(state.sortField==='nombre') return dir*a.displayName.localeCompare(b.displayName);
    if(state.sortField==='planes') return dir*(a.contractsFiltered.length-b.contractsFiltered.length);
    if(state.sortField==='variacion'){
      const pa=clientPrevImpago(a.key), pb=clientPrevImpago(b.key);
      const da=a.totalImpago-(pa==null?a.totalImpago:pa), db=b.totalImpago-(pb==null?b.totalImpago:pb);
      return dir*(da-db);
    }
    return dir*(a.totalImpago-b.totalImpago);
  });
  return list;
}

// ---------- data actions ----------
async function handleProcess(){
  state.error=''; state.notice='';
  if(!state.deudoresFile){ state.error='Subí al menos el archivo de deudores.'; render(); return; }
  state.loading = true; render();
  try{
    const deudoresRows = await readWorkbook(state.deudoresFile);
    const deudoresMap = parseDeudores(deudoresRows);
    if(deudoresMap.size===0) throw new Error('No encontré filas de deudores en el archivo DEUDORES.');

    let nuevosRecibos = 0;
    if(state.recibosFile){
      const recibosRows = await readWorkbook(state.recibosFile);
      const recibosMap = parseRecibos(recibosRows);
      const paymentRecords = buildPaymentRecords(recibosMap);
      await upsertPayments(paymentRecords);
      nuevosRecibos = paymentRecords.length;
    }
    const paymentsByClientMap = await fetchPaymentsByClient();
    const built = buildClients(deudoresMap, paymentsByClientMap);

    const dates = await listSnapshotDates();
    const priorDates = dates.filter(d=>d<state.cutoffDate).sort();
    let prev = null;
    if(priorDates.length>0){
      try{ prev = await getSnapshot(priorDates[priorDates.length-1]); }catch(e){}
    }
    const snap = snapshotFromClients(built, state.cutoffDate);
    const already = dates.includes(state.cutoffDate);
    await saveSnapshot(state.cutoffDate, snap);
    state.snapshotDates = await listSnapshotDates();
    state.generalLoaded = false;

    state.clients = built;
    state.prevSnapshot = prev;
    const estadoOpts = Array.from(new Set(built.flatMap(c=>c.contracts.map(ct=>ct.estado)))).sort();
    const gerenciaOpts = Array.from(new Set(built.flatMap(c=>c.contracts.map(ct=>ct.gerencia)))).sort();
    state.estadoFilter = new Set(estadoOpts);
    state.gerenciaFilter = new Set(gerenciaOpts);
    state.search='';

    const recibosMsg = state.recibosFile
      ? (' Se procesaron '+nuevosRecibos+' recibo(s) del archivo subido (se suman a los que ya tenías guardados).')
      : ' No subiste recibos nuevos, así que los últimos pagos se calculan con lo que ya estaba guardado.';
    state.notice = (already
      ? 'Actualicé la foto compartida del '+shortDate(state.cutoffDate)+' (ya existía una carga para esa fecha).'
      : 'Guardé la foto compartida del '+shortDate(state.cutoffDate)+'.') + recibosMsg;
    state.view='dashboard';
  } catch(e){
    state.error = (e && e.message) ? e.message : 'Ocurrió un error al procesar los archivos.';
  } finally {
    state.loading = false;
    render();
  }
}

function resetToUpload(){
  state.view='upload'; state.deudoresFile=null; state.recibosFile=null;
  state.error=''; state.notice=''; state.cutoffDate=todayISO();
  render();
}

async function loadTrackHistory(key){
  state.trackLoading = true; state.trackHistoryRaw=[]; render();
  try{
    const recent = state.snapshotDates.slice(-60);
    const raw=[];
    for(const d of recent){
      try{
        const snap = await getSnapshot(d);
        if(!snap) continue;
        const c = snap.clients[key];
        if(!c) continue;
        raw.push({date:d, contracts:c.contracts});
      }catch(e){}
    }
    state.trackHistoryRaw = raw;
  } finally { state.trackLoading=false; render(); }
}
// recalcula los totales del cliente seleccionado a partir de lo ya descargado,
// aplicando el filtro de Estado/Gerencia vigente (no vuelve a pedir nada a la base)
function computeTrackHistory(){
  return state.trackHistoryRaw.map(entry=>{
    let impago=0, precancelable=0, adeudado=0;
    for(const ct of Object.values(entry.contracts)){
      if(!state.estadoFilter.has(ct.estado) || !state.gerenciaFilter.has(ct.gerencia)) continue;
      impago+=ct.valorTotalImpago; precancelable+=ct.valorTotalPrecancelable; adeudado+=ct.totalAdeudado;
    }
    return {date:entry.date, impago, precancelable, adeudado};
  });
}

function parsePlanCuotas(rows){
  if(!rows.length) throw new Error('El archivo está vacío.');
  const header = rows[0];
  const col = { grupo: findCol(header, ['grupo']), cuotas: findCol(header, ['cantidad de cuotas del plan']) };
  if(col.grupo===-1 || col.cuotas===-1) throw new Error('El archivo necesita columnas "Grupo" y "Cantidad de Cuotas del Plan".');
  const out = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r[col.grupo]==null || r[col.grupo]==='') continue;
    out.push({grupo:normGrupo(r[col.grupo]), cuotas:Number(r[col.cuotas])||0});
  }
  return out;
}

// ---------- información presupuestaria (carga manual mensual, no viene de ningún excel) ----------
const PRESUPUESTO_CONCEPTS = [
  {key:'facturacionCuota', label:'Facturación Mensual de Cuota', color:'#0A70A1'},
  {key:'facturacionGastosAdmin', label:'Facturación Mensual de Gs. Administrativos', color:'#0d9488'},
  {key:'presupuestoGastosAdmin', label:'Presupuesto de Gastos Administrativos', color:'#e11d48'},
  {key:'cobranzaBancaria', label:'Cobranza Bancaria Total por Mes', color:'#7c3aed'},
  {key:'gastosAdminCobrados', label:'Gastos Administrativos Cobrados', color:'#d97706'},
];
const PRESUPUESTO_FISCAL_START = '2025-11'; // el balance arranca en noviembre
function monthStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function parseMonthStr(s){ const [y,m]=s.split('-').map(Number); return new Date(y, m-1, 1); }
function addMonths(d, n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
function monthLabel(mesStr){
  const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const [y,m]=mesStr.split('-').map(Number);
  return MESES[m-1]+' '+y;
}
// la lista de meses siempre incluye desde el arranque del balance hasta el mes
// actual (o hasta el último mes con datos guardados, lo que sea más lejano),
// más un mes extra de "buffer" para poder ir cargando el próximo balance sin
// tener que tocar nada de código
function getBudgetMonths(){
  const start = parseMonthStr(PRESUPUESTO_FISCAL_START);
  let latest = monthStr(new Date());
  state.presupuestoData.forEach((v,k)=>{ if(k>latest) latest=k; });
  const endDate = addMonths(parseMonthStr(latest), 1);
  const months=[];
  let d = start;
  while(monthStr(d) <= monthStr(endDate)){
    months.push(monthStr(d));
    d = addMonths(d,1);
  }
  return months;
}
function emptyPresupuestoRow(){
  return {facturacionCuota:0, facturacionGastosAdmin:0, presupuestoGastosAdmin:0, cobranzaBancaria:0, gastosAdminCobrados:0};
}
async function fetchPresupuesto(){
  const {data, error} = await sb.from('presupuesto').select('*').order('mes');
  if(error) throw error;
  const map = new Map();
  (data||[]).forEach(r=> map.set(r.mes, {
    facturacionCuota:Number(r.facturacion_cuota)||0,
    facturacionGastosAdmin:Number(r.facturacion_gastos_admin)||0,
    presupuestoGastosAdmin:Number(r.presupuesto_gastos_admin)||0,
    cobranzaBancaria:Number(r.cobranza_bancaria)||0,
    gastosAdminCobrados:Number(r.gastos_admin_cobrados)||0,
  }));
  return map;
}
async function upsertPresupuesto(rows){
  if(!rows.length) return;
  const payload = rows.map(r=>({
    mes:r.mes,
    facturacion_cuota:Number(r.facturacionCuota)||0,
    facturacion_gastos_admin:Number(r.facturacionGastosAdmin)||0,
    presupuesto_gastos_admin:Number(r.presupuestoGastosAdmin)||0,
    cobranza_bancaria:Number(r.cobranzaBancaria)||0,
    gastos_admin_cobrados:Number(r.gastosAdminCobrados)||0,
  }));
  const {error} = await sb.from('presupuesto').upsert(payload, {onConflict:'mes'});
  if(error) throw error;
}
async function loadPresupuesto(){
  state.presupuestoLoading = true; render();
  try{
    state.presupuestoData = await fetchPresupuesto();
    getBudgetMonths().forEach(m=>{ if(!state.presupuestoData.has(m)) state.presupuestoData.set(m, emptyPresupuestoRow()); });
    state.presupuestoLoaded = true;
  } finally { state.presupuestoLoading=false; render(); }
}
async function handleSavePresupuesto(){
  if(state.presupuestoDirtyMonths.size===0) return;
  state.presupuestoLoading = true; render();
  try{
    const rows = Array.from(state.presupuestoDirtyMonths).map(m=> Object.assign({mes:m}, state.presupuestoData.get(m)||emptyPresupuestoRow()));
    await upsertPresupuesto(rows);
    state.presupuestoDirtyMonths = new Set();
    state.notice = 'Se guardaron los cambios de '+rows.length+' mes(es).';

    state.error = (e&&e.message)||'No pude guardar los cambios.';
  } finally { state.presupuestoLoading=false; render(); }
}

// ---------- cuotas totales por plan (tabla de referencia, no viene en DEUDORES) ----------
function normGrupo(g){
  let s = (g==null?'':String(g)).trim();
  s = s.replace(/^0+(?=\d)/,''); // "085" y "85" deben ser el mismo grupo
  return s;
}
async function fetchPlanCuotas(){
  const {data, error} = await sb.from('plan_cuotas').select('grupo,cuotas').order('grupo');
  if(error) throw error;
  const map = new Map();
  for(const r of (data||[])) map.set(normGrupo(r.grupo), Number(r.cuotas));
  return map;
}
async function upsertPlanCuotas(rows){
  if(!rows.length) return;
  const payload = rows.map(r=>({grupo:normGrupo(r.grupo), cuotas:Number(r.cuotas)||0}));
  const {error} = await sb.from('plan_cuotas').upsert(payload, {onConflict:'grupo'});
  if(error) throw error;
}
async function deletePlanCuota(grupo){
  const {error} = await sb.from('plan_cuotas').delete().eq('grupo', normGrupo(grupo));
  if(error) throw error;
}

// carga la última foto guardada (deudores + pagos acumulados) y lleva directo
// al panel. Se usa tanto al abrir la página (si ya estás logueado) como
// justo después de poner la contraseña correcta en un dispositivo nuevo.
async function loadLatestSnapshotIntoView(){
  if(state.snapshotDates.length===0) return;
  const latest = state.snapshotDates[state.snapshotDates.length-1];
  const snap = await getSnapshot(latest);
  if(!snap) return;
  state.clients = clientsFromSnapshot(snap);
  try{
    const paymentsByClientMap = await fetchPaymentsByClient();
    state.clients.forEach(c=>{ c.payments = paymentsByClientMap.get(c.key) || []; });
  }catch(e){ /* si falla, se muestran igual los contratos sin los últimos pagos */ }
  const estadoOpts = Array.from(new Set(state.clients.flatMap(c=>c.contracts.map(ct=>ct.estado)))).sort();
  const gerenciaOpts = Array.from(new Set(state.clients.flatMap(c=>c.contracts.map(ct=>ct.gerencia)))).sort();
  state.estadoFilter = new Set(estadoOpts);
  state.gerenciaFilter = new Set(gerenciaOpts);
  const prior = state.snapshotDates.filter(d=>d<latest);
  if(prior.length) state.prevSnapshot = await getSnapshot(prior[prior.length-1]);
  state.notice = 'Mostrando la última foto guardada ('+shortDate(latest)+'). Subí archivos nuevos para actualizarla.';
  state.view = 'dashboard';
}

async function handleAuthSubmit(){
  const val = document.getElementById('auth-password').value;
  if(val === APP_PASSWORD){
    localStorage.setItem('morosidad_auth','ok');
    state.authed = true;
    state.booting = true; render();
    try{
      state.snapshotDates = await listSnapshotDates();
      await loadLatestSnapshotIntoView();
    }catch(e){ /* si falla, igual dejamos pasar a la pantalla de carga */ }
    state.booting = false;
    render();
  } else {
    document.getElementById('auth-error').style.display='block';
  }
}

// ---------- render ----------
const root = document.getElementById('app');

function render(){
  root.innerHTML = '';
  if(chatRootEl) chatRootEl.innerHTML = '';
  if(state.booting){ root.innerHTML = '<div class="empty"><span class="spin">⟳</span> Cargando...</div>'; return; }
  if(!state.configOk){ root.innerHTML = buildConfigNeeded(); return; }
  if(!state.dbOk){ root.innerHTML = buildDbNeeded(); return; }
  if(!state.authed){ root.innerHTML = buildAuth(); attachAuthEvents(); return; }

  let html = buildHeader();
  if(state.empresaActiva==='TRANSCOL'){
    html += buildTranscol();
  } else if(state.view==='upload') html += buildUpload();
  else if(state.view==='dashboard') html += buildDashboard();
  else if(state.view==='mora-general') html += buildMoraGeneral();
  else if(state.view==='seguimiento') html += buildSeguimiento();
  else if(state.view==='informe') html += buildInforme();
  else if(state.view==='presupuesto') html += buildPresupuesto();
  root.innerHTML = html;
  attachEvents();
  renderChat();
  if(state.view==='mora-general') drawGeneralChart();
  if(state.view==='seguimiento') drawTrackChart();
  if(state.view==='presupuesto') drawPresupuestoChart();
  if(state.empresaActiva==='TRANSCOL' && state.riesgoView==='generador' && state.cg && state.cg.modo==='preview') cgRenderPreview();
}

function buildUpload(){

    '<div class="chip" style="color:#64748b;background:#fff;border:1px solid var(--border);border-radius:8px;padding:7px 12px;width:fit-content;margin-bottom:20px;">⏱ Última foto guardada: <b class="font-num">'+esc(shortDate(state.snapshotDates[state.snapshotDates.length-1]))+'</b> · '+state.snapshotDates.length+' foto(s) en total</div>' : '';
  const backLink = state.clients.length ?
    '<button class="btn-ghost-dark" data-action="cancel-upload" style="margin-bottom:14px;">← Volver al panel sin subir nada</button>' : '';
  return '<div class="narrow">'+

        '💾 Guardar cambios'+(state.presupuestoDirtyMonths.size>0?' ('+state.presupuestoDirtyMonths.size+')':'')+
      '</button>'+
    '</div>'+
  '</div>';
  html += '<div class="table-wrap"><table><thead><tr><th>Mes</th>'+

async function exportPresupuestoExcel(){
  const months = getBudgetMonths();
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Presupuesto');
  ws.columns = [{width:14}, ...PRESUPUESTO_CONCEPTS.map(()=>({width:22}))];
  const headerRow = 1;
  ws.getCell(headerRow,1).value = 'Mes';
  PRESUPUESTO_CONCEPTS.forEach((c,i)=>{ ws.getCell(headerRow,i+2).value = c.label; });
  for(let col=1; col<=PRESUPUESTO_CONCEPTS.length+1; col++){
    const cell = ws.getCell(headerRow,col);
    cell.font = {bold:true};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFD9D9D9'}};
    cell.border = thinBorderAll();
  }
  let r = headerRow+1;
  months.forEach(m=>{
    const row = state.presupuestoData.get(m) || emptyPresupuestoRow();
    ws.getCell(r,1).value = monthLabel(m);
    ws.getCell(r,1).border = thinBorderAll();
    PRESUPUESTO_CONCEPTS.forEach((c,i)=>{
      const cell = ws.getCell(r, i+2);
      cell.value = row[c.key]; cell.numFmt = '"$"#,##0';
      cell.border = thinBorderAll();
    });
    r++;
  });
  const buf = await wb.xlsx.writeBuffer();
  downloadBlob(buf, 'Presupuesto_'+todayISO()+'.xlsx');
}

  if(state.error){ html += '<div class="banner error">⚠ '+esc(state.error)+'</div>'; }
  if(state.notice){ html += '<div class="banner notice">✓ '+esc(state.notice)+'</div>'; }

  if(state.planCuotasLoading){ html += '<div class="empty"><span class="spin">⟳</span> Cargando...</div>'; return html+'</main>'; }
  if(!state.informeGerencia){ html += '<div class="muted-italic">No hay gerencias cargadas todavía. Procesá un archivo de deudores primero.</div>'; return html+'</main>'; }

  const items = computeCuotasReport(state.informeGerencia);
  if(items.length===0){ html += '<div class="muted-italic">No hay clientes con contratos en esa gerencia.</div>'; return html+'</main>'; }

  const faltantes = new Set();
  items.forEach(it=>{ it.rows.forEach(r=>{ if(r.aVencer==null) faltantes.add(r.grupo); }); });
  if(faltantes.size){
    html += '<div class="banner error">⚠ Falta cargar la cantidad de cuotas del plan para estos grupos: '+
      Array.from(faltantes).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).join(', ')+
      '. Esos casos muestran "?" en Cuotas a vencer, cargalos arriba.</div>';
  }

  html += '<div id="informe-tables">';
  items.forEach(it=>{ html += buildClientReportBlock(it); });
  html += '</div>';

  return html+'</main>';
}
