// ---------- exportar a Excel (con el mismo diseño de colores) ----------
function thinBorderAll(){ return {top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}}; }
function sanitizeSheetName(name){ return (name||'Hoja').replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31) || 'Hoja'; }
function sanitizeFilename(name){ return (name||'archivo').replace(/[^A-Za-z0-9 ._-]/g,'_').slice(0,80); }
function downloadBlob(buffer, filename){
  const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function addClientReportSheet(wb, it){
  const ws = wb.addWorksheet(sanitizeSheetName(it.clientName));
  ws.columns = [{width:30},{width:9},{width:10},{width:9},{width:10},{width:10},{width:16},{width:16}];

  ws.mergeCells('A1:H1');
  const title = ws.getCell('A1');
  title.value = 'DEUDA COLSERVICE';
  title.font = {bold:true, color:{argb:'FFFFFFFF'}, size:13};
  title.alignment = {horizontal:'center', vertical:'middle'};
  title.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF0A70A1'}};
  ws.getRow(1).height = 22;

  ws.mergeCells('A2:A3'); ws.mergeCells('B2:B3'); ws.mergeCells('C2:C3');
  ws.mergeCells('D2:F2'); ws.mergeCells('G2:H2');
  ws.getCell('A2').value='CLIENTE'; ws.getCell('B2').value='GRUPO'; ws.getCell('C2').value='CÍRCULOS';
  ws.getCell('D2').value='CUOTAS'; ws.getCell('G2').value='DEUDA';
  ws.getCell('D3').value='PAGAS'; ws.getCell('E3').value='VENCIDAS'; ws.getCell('F3').value='A VENCER';
  ws.getCell('G3').value='VENCIDA'; ws.getCell('H3').value='A VENCER';
  ['A2','B2','C2','D2','G2','D3','E3','F3','G3','H3'].forEach(addr=>{
    const cell = ws.getCell(addr);
    cell.font = {bold:true};
    cell.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFD9D9D9'}};
    cell.border = thinBorderAll();
  });

  let r = 4;
  const firstDataRow = r;
  it.rows.forEach(row=>{
    ws.getCell('B'+r).value = row.grupo;
    ws.getCell('C'+r).value = row.count;
    ws.getCell('D'+r).value = row.pagadas;
    ws.getCell('E'+r).value = row.vencidas;
    ws.getCell('F'+r).value = row.aVencer==null ? '?' : row.aVencer;
    ws.getCell('G'+r).value = row.deudaVencida; ws.getCell('G'+r).numFmt = '"$"#,##0.00';
    ws.getCell('H'+r).value = row.deudaAVencer; ws.getCell('H'+r).numFmt = '"$"#,##0.00';
    ['B','C','D','E','F','G','H'].forEach(col=>{
      const cell = ws.getCell(col+r);
      cell.alignment = {horizontal:'center'};
      cell.border = thinBorderAll();
    });
    r++;
  });
  ws.getCell('B'+r).value = 'TOTAL'; ws.getCell('B'+r).font = {bold:true};
  ws.getCell('C'+r).value = it.totalCirculos; ws.getCell('C'+r).font = {bold:true};
  ['B','C','D','E','F','G','H'].forEach(col=>{ ws.getCell(col+r).border = thinBorderAll(); ws.getCell(col+r).alignment={horizontal:'center'}; });
  const totalRow = r; r++;

  ws.mergeCells('A'+firstDataRow+':A'+totalRow);
  const clientCell = ws.getCell('A'+firstDataRow);
  clientCell.value = it.clientName;
  clientCell.font = {bold:true};
  clientCell.alignment = {horizontal:'left', vertical:'middle', wrapText:true};
  for(let rr=firstDataRow; rr<=totalRow; rr++){ ws.getCell('A'+rr).border = thinBorderAll(); }

  ws.mergeCells('A'+r+':F'+r);
  ws.getCell('A'+r).value = 'TOTALES';
  ws.getCell('A'+r).alignment = {horizontal:'center', vertical:'middle'};
  ws.getCell('G'+r).value = it.totalDeudaVencida; ws.getCell('G'+r).numFmt = '"$"#,##0.00';
  ws.getCell('H'+r).value = it.totalDeudaAVencer; ws.getCell('H'+r).numFmt = '"$"#,##0.00';
  ['A','G','H'].forEach(col=>{
    const cell = ws.getCell(col+r);
    cell.font = {bold:true};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFFFF00'}};
    cell.border = thinBorderAll();
  });
}

// ---------- llamar a la función de lectura de PDFs con IA ----------
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const result = reader.result; // "data:application/pdf;base64,XXXX"
      const b64 = result.split(',')[1];
      resolve(b64);
    };
    reader.onerror = ()=> reject(new Error('No se pudo leer el archivo.'));
    reader.readAsDataURL(file);
  });
}
const RIESGO_DOC_LABELS = {
  veraz: 'Informe Veraz/Nosis', balance: 'Balance General', ddjjIva0: 'DDJJ IVA (mes 1)',
  ddjjIva1: 'DDJJ IVA (mes 2)', ddjjIva2: 'DDJJ IVA (mes 3)', reciboSueldo: 'Recibo de sueldo',
  monotributo: 'Constancia/pagos de Monotributo', ddjjGanancias: 'DDJJ Ganancias/Bienes Personales',
  constanciaCuit: 'Constancia de CUIT',
};
function docTipoFor(claveDoc){
  if(claveDoc.startsWith('ddjjIva')) return 'ddjj_iva';
  if(claveDoc==='reciboSueldo') return 'recibo_sueldo';
  return claveDoc==='veraz' ? 'veraz' : claveDoc==='balance' ? 'balance' : claveDoc==='monotributo' ? 'monotributo'
    : claveDoc==='ddjjGanancias' ? 'ddjj_ganancias' : claveDoc==='constanciaCuit' ? 'constancia_cuit' : claveDoc;
}
async function analizarDocumentoIA(claveDoc, file){
  state.riesgoDocEstados[claveDoc] = 'leyendo';
  state.riesgoDocErrores[claveDoc] = '';
  render();
  try{
    const b64 = await fileToBase64(file);
    const tipo = docTipoFor(claveDoc);
    const {data, error} = await sb.functions.invoke('leer-documento', { body: { tipo, pdf_base64: b64 } });
    if(error) throw error;
    if(!data || data.error) throw new Error((data && data.error) || 'La IA no pudo leer el documento.');
    if(claveDoc.startsWith('ddjjIva')){
      const idx = Number(claveDoc.replace('ddjjIva',''));
      const periodos = Array.isArray(data.data && data.data.periodos) ? data.data.periodos.filter(p=>p && p.periodo && p.ventas_gravadas!=null) : [];
      if(periodos.length>=2){
        // el documento trae varios meses juntos (ej. un reporte de ventas anual):
        // completamos los 3 casilleros solos con los últimos 3 períodos distintos
        const ordenados = periodos.slice().sort((a,b)=>String(a.periodo).localeCompare(String(b.periodo)));
        const ultimos3 = ordenados.slice(-3);
        state.riesgoDatos.ddjjIva = [ultimos3[0]||null, ultimos3[1]||null, ultimos3[2]||null];
        ['ddjjIva0','ddjjIva1','ddjjIva2'].forEach((k,i)=>{
          state.riesgoDocEstados[k] = ultimos3[i] ? 'leido' : (state.riesgoDocEstados[k]||'pendiente');
        });
        state.notice = 'Encontré '+periodos.length+' mes(es) en ese documento y completé los 3 casilleros de DDJJ IVA automáticamente.';
      } else if(periodos.length===1){
        state.riesgoDatos.ddjjIva[idx] = periodos[0];
      } else {
        state.riesgoDatos.ddjjIva[idx] = null;
        state.riesgoDocEstados[claveDoc] = 'error';
        state.riesgoDocErrores[claveDoc] = 'No pude encontrar ningún período/ventas en ese documento.';
        render();
        return;
      }
    } else {
      state.riesgoDatos[claveDoc] = data.data;
    }
    state.riesgoDocEstados[claveDoc] = 'leido';
  } catch(e){
    state.riesgoDocEstados[claveDoc] = 'error';
    state.riesgoDocErrores[claveDoc] = (e && e.message) || 'Error al analizar el documento.';
  } finally { render(); }
}

// ---------- motor de scoring (idéntico al probado por separado) ----------
function scorePF(d){
  const blocks=[], redFlags=[];
  let b1=0,b1detalle='',b1brecha='';
  const v=d.veraz;
  if(!v){ b1=0; b1detalle='Falta el informe Veraz/Nosis.'; b1brecha='Cargá el informe Veraz/Nosis para poder puntuar este bloque.'; redFlags.push('No se cargó el informe Veraz/Nosis.'); }
  else{
    const situ=v.situacion_bcra;
    if(situ==null){ b1=0; b1detalle='No se pudo determinar la situación BCRA.'; b1brecha='Necesita un informe Veraz/Nosis que indique la situación BCRA.'; }
    else if(situ>=3 || v.embargos_o_juicios_activos){
      b1=0; b1detalle='Situación BCRA '+situ+(v.embargos_o_juicios_activos?', con embargos/juicios activos':'')+'.';
      b1brecha='Requiere resolver la situación de riesgo (regularizar deuda/embargos) y llegar a situación 1 sin cheques rechazados.';
      redFlags.push('Veraz/Nosis: situación de riesgo (BCRA '+situ+(v.embargos_o_juicios_activos?', embargos/juicios activos':'')+').');
    } else if(situ===1 && v.cheques_rechazados && !v.cheques_rechazados_regularizados){
      b1=10; b1detalle='Situación 1, pero con cheques rechazados sin regularizar.'; b1brecha='Para subir, pagar los cheques rechazados (y acreditarlo con un informe actualizado) y no registrar nuevos rechazos.';
    } else if(situ===1 && !v.cheques_rechazados){ b1=35; b1detalle='Situación 1, sin cheques rechazados ni mora registrada.'; }
    else if(situ===1 && v.cheques_rechazados && v.cheques_rechazados_regularizados){ b1=20; b1detalle='Situación 1 con cheques rechazados ya regularizados.'; b1brecha='Para el máximo, no debería registrar cheques rechazados en el historial (aunque estén regularizados).'; }
    else if(situ===2){ b1=10; b1detalle='Situación 2 / deudas comerciales en gestión.'; b1brecha='Para el máximo, necesita subir a situación 1 en BCRA y no tener cheques rechazados.'; }
    else { b1=10; b1detalle='Situación '+situ+'.'; b1brecha='Para el máximo, necesita subir a situación 1 en BCRA y no tener cheques rechazados.'; }
  }
  blocks.push({nombre:'Informe Veraz/Nosis', pts:b1, max:35, detalle:b1detalle, brecha:b1brecha});

  let b2=0,b2detalle='',b2brecha='';
  const canon=sumCanones(d);
  let ingresoMensual=null;
  if(d.reciboSueldo && d.reciboSueldo.sueldo_neto) ingresoMensual=Number(d.reciboSueldo.sueldo_neto);
  else if(d.ddjjGanancias && d.ddjjGanancias.ingresos_declarados) ingresoMensual=Number(d.ddjjGanancias.ingresos_declarados)/12;
  if(!ingresoMensual || !canon){ b2=0; b2detalle='Faltan datos de canon o ingreso mensual para calcular la relación.'; b2brecha='Cargá el/los cánones y el ingreso mensual (recibo de sueldo o DDJJ) para poder calcular este bloque.'; }
  else{
    const ratio=(canon/ingresoMensual)*100;
    if(ratio>50){ b2=0; b2detalle='Relación Canon/Ingreso: '+ratio.toFixed(1)+'%.'; b2brecha='La relación Canon/Ingreso supera el 50%; por reglamento la operación queda directamente incompatible.'; redFlags.push('Relación Canon Leasing / Ingreso Neto mayor al 50% ('+ratio.toFixed(1)+'%).'); }
    else if(ratio<=20){ b2=30; b2detalle='Relación Canon/Ingreso: '+ratio.toFixed(1)+'%.'; }
    else if(ratio<=35){ b2=20; b2detalle='Relación Canon/Ingreso: '+ratio.toFixed(1)+'%.'; b2brecha='Para el máximo, la relación Canon/Ingreso debería bajar al 20% o menos (hoy está en '+ratio.toFixed(1)+'%).'; }
    else { b2=10; b2detalle='Relación Canon/Ingreso: '+ratio.toFixed(1)+'%.'; b2brecha='Para el máximo, la relación Canon/Ingreso debería bajar al 20% o menos (hoy está en '+ratio.toFixed(1)+'%).'; }
  }
  blocks.push({nombre:'Capacidad de pago', pts:b2, max:30, detalle:b2detalle, brecha:b2brecha});

  let b3=0,b3detalle='',b3brecha='';
  if(d.regimenIngreso==='dependencia'){
    const r=d.reciboSueldo, ant=Number(d.antiguedadAnios)||0;
    if(!r){ b3=0; b3detalle='Falta el recibo de sueldo.'; b3brecha='Cargá el recibo de sueldo para poder puntuar este bloque.'; }
    else if(ant>3){ b3=20; b3detalle='Empleo estable, antigüedad mayor a 3 años.'; }
    else if(ant>=1){ b3=12; b3detalle='Antigüedad entre 1 y 3 años.'; b3brecha='Para el máximo, necesita más de 3 años de antigüedad laboral (hoy tiene '+ant+').'; }
    else { b3=5; b3detalle='Antigüedad menor a 1 año.'; b3brecha='Para el máximo, necesita más de 3 años de antigüedad laboral (hoy tiene '+ant+').'; }
  } else if(d.regimenIngreso==='autonomo'){
    const dg=d.ddjjGanancias, mono=d.monotributo;
    if(dg){ b3=20; b3detalle='DDJJ de Ganancias/Bienes Personales con patrimonio solvente.'; }
    else if(mono && mono.pagos_al_dia && (mono.meses_cubiertos||0)>=6){ b3=20; b3detalle='Monotributo al día, últimos 6 pagos cubiertos.'; }
    else if(mono){ b3=10; b3detalle='Monotributo con pagos parciales o moratoria.'; b3brecha='Para el máximo, necesita el DDJJ de Ganancias/Bienes Personales, o 6 pagos consecutivos de Monotributo al día.'; }
    else { b3=0; b3detalle='Falta documentación de respaldo de ingresos.'; b3brecha='Cargá el DDJJ de Ganancias/Bienes Personales o los pagos de Monotributo.'; }
  } else { b3=0; b3detalle='No se indicó el régimen de ingresos (dependencia / autónomo).'; b3brecha='Elegí el régimen de ingresos del evaluado.'; }
  blocks.push({nombre:'Respaldo de ingresos', pts:b3, max:20, detalle:b3detalle, brecha:b3brecha});

  let b4=0,b4detalle='',b4brecha='';
  const cc=d.constanciaCuit;
  if(!cc){ b4=0; b4detalle='Falta la constancia de CUIT/CUIL.'; b4brecha='Cargá la constancia de CUIT/CUIL para poder puntuar este bloque.'; }
  else if(!cc.impuestos_con_deuda_o_incumplimiento && String(cc.estado_clave||'').toLowerCase().includes('activ')){ b4=15; b4detalle='CUIT/CUIL activo, sin deudas ni observaciones.'; }
  else { b4=8; b4detalle='Inconsistencia menor o trámite de actualización pendiente.'; b4brecha='Para el máximo, hay que resolver la inconsistencia o completar el trámite de actualización pendiente en AFIP/ARCA.'; }
  blocks.push({nombre:'Identificación fiscal', pts:b4, max:15, detalle:b4detalle, brecha:b4brecha});

  return finalizeRiesgoScore(blocks, redFlags, 'PF', d.cac);
}
function scorePJ(d){
  const blocks=[], redFlags=[];
  let b1=0,b1detalle='',b1brecha='';
  const v=d.veraz;
  if(!v){ b1=0; b1detalle='Falta el informe Veraz/Nosis.'; b1brecha='Cargá el informe Veraz/Nosis para poder puntuar este bloque.'; redFlags.push('No se cargó el informe Veraz/Nosis.'); }
  else{
    const situ=v.situacion_bcra;
    if(situ==null){ b1=0; b1detalle='No se pudo determinar la situación BCRA.'; b1brecha='Necesita un informe Veraz/Nosis que indique la situación BCRA.'; }
    else if(situ>=3 || v.embargos_o_juicios_activos){
      b1=0; b1detalle='Situación BCRA '+situ+(v.embargos_o_juicios_activos?', con embargos/juicios activos':'')+'.';

    } else if(situ===1 && v.cheques_rechazados && !v.cheques_rechazados_regularizados){
      b1=8; b1detalle='Situación 1 empresa, pero con cheques rechazados sin regularizar.'; b1brecha='Para subir, pagar los cheques rechazados (y acreditarlo con un informe actualizado) y no registrar nuevos rechazos.';
    } else if(situ===1 && !v.cheques_rechazados){ b1=25; b1detalle='Situación 1 en la empresa y sus socios/directores.'; }
    else if(situ===1 && v.cheques_rechazados && v.cheques_rechazados_regularizados){ b1=15; b1detalle='Situación 1 empresa, cheques s/fondo ya pagados.'; b1brecha='Para el máximo, la empresa y sus socios/directores no deberían tener cheques rechazados en el historial.'; }
    else if(situ===2){ b1=8; b1detalle='Situación 2 en la empresa.'; b1brecha='Para el máximo, la empresa necesita estar en situación 1 en BCRA, tanto ella como sus socios/directores.'; }
    else { b1=8; b1detalle='Situación '+situ+'.'; b1brecha='Para el máximo, la empresa necesita estar en situación 1 en BCRA, tanto ella como sus socios/directores.'; }
  }
  blocks.push({nombre:'Informe Veraz/Nosis (empresa y directivos)', pts:b1, max:25, detalle:b1detalle, brecha:b1brecha});

  let b2=0,b2detalle='',b2brecha='';
  const bal=d.balance;
  if(!bal){ b2=0; b2detalle='Falta el balance general.'; b2brecha='Cargá el último balance general auditado para poder puntuar este bloque.'; redFlags.push('No se cargó el balance general.'); }
  else{
    const pn=Number(bal.patrimonio_neto), pasivo=Number(bal.pasivo_total), ganancia=Number(bal.ganancia_ejercicio);
    if(bal.en_concurso_o_quiebra || (!isNaN(pn) && pn<0)){
      b2=0; b2detalle = bal.en_concurso_o_quiebra ? 'Empresa en concurso preventivo o quiebra.' : 'Patrimonio Neto negativo.';
      b2brecha = bal.en_concurso_o_quiebra ? 'La situación concursal hace que la operación sea directamente incompatible.' : 'El Patrimonio Neto negativo hace que la operación sea directamente incompatible.';
      redFlags.push(bal.en_concurso_o_quiebra ? 'Empresa en concurso preventivo o quiebra.' : 'Balance con Patrimonio Neto negativo.');
    } else {
      const apalancamiento = pn>0 ? pasivo/pn : Infinity;
      if(ganancia>0 && apalancamiento<2.0){ b2=25; b2detalle='Rentabilidad positiva, apalancamiento '+apalancamiento.toFixed(2)+'.'; }
      else if(ganancia>0 && apalancamiento<=4.0){ b2=15; b2detalle='Rentabilidad positiva, apalancamiento '+apalancamiento.toFixed(2)+'.'; b2brecha='Para el máximo, el apalancamiento (Pasivo/PN) debería bajar de 2,0 (hoy está en '+apalancamiento.toFixed(2)+').'; }
      else if(Math.abs(ganancia)<1 || apalancamiento>4.0){ b2=8; b2detalle='Balance en equilibrio o apalancamiento alto ('+apalancamiento.toFixed(2)+').'; b2brecha='Para el máximo, necesita rentabilidad positiva y apalancamiento menor a 2,0 (hoy '+apalancamiento.toFixed(2)+').'; }
      else { b2=0; b2detalle='Pérdida operativa severa.'; b2brecha='Necesita revertir el resultado a ganancia para poder puntuar este bloque.'; redFlags.push('Balance con pérdida operativa severa.'); }
    }
  }
  blocks.push({nombre:'Análisis del balance general', pts:b2, max:25, detalle:b2detalle, brecha:b2brecha});

  let b3=0,b3detalle='',b3brecha='';
  const ddjjs=(d.ddjjIva||[]).filter(Boolean).slice().sort((a,b)=>String(a.periodo||'').localeCompare(String(b.periodo||'')));
  if(ddjjs.length<2){ b3=0; b3detalle='Faltan DDJJ de IVA suficientes para evaluar la tendencia (mínimo 2).'; b3brecha='Cargá al menos 2 meses de DDJJ de IVA o reporte de ventas para poder puntuar este bloque.'; }
  else{
    const first=ddjjs[0].ventas_gravadas||0, last=ddjjs[ddjjs.length-1].ventas_gravadas||0;
    const variacion = first>0 ? ((last-first)/first*100) : 0;
    if(variacion>=-10){ b3=20; b3detalle='Facturación constante o con caída menor al 10% ('+variacion.toFixed(1)+'%).'; }
    else if(variacion>=-30){ b3=12; b3detalle='Facturación con variaciones moderadas ('+variacion.toFixed(1)+'%).'; b3brecha='Para el máximo, la facturación debería mantenerse estable o caer menos del 10% (hoy varió '+variacion.toFixed(1)+'%).'; }
    else { b3=5; b3detalle='Caída severa en la facturación reciente ('+variacion.toFixed(1)+'%).'; b3brecha='Para el máximo, la facturación debería mantenerse estable o caer menos del 10% (hoy varió '+variacion.toFixed(1)+'%).'; }
  }
  blocks.push({nombre:'Ventas y flujo reciente (DDJJ IVA)', pts:b3, max:20, detalle:b3detalle, brecha:b3brecha});

  let b4=0,b4detalle='',b4brecha='';
  const canon=sumCanones(d);
  const ventasPromedio = ddjjs.length ? ddjjs.reduce((s,x)=>s+(x.ventas_gravadas||0),0)/ddjjs.length : 0;
  if(!canon || !ventasPromedio){ b4=0; b4detalle='Faltan datos de canon o ventas promedio.'; b4brecha='Cargá el/los cánones y al menos 2 meses de ventas para poder calcular este bloque.'; }
  else{
    const ratio=canon/ventasPromedio*100;
    if(ratio<=10){ b4=15; b4detalle='El canon representa el '+ratio.toFixed(1)+'% de las ventas promedio.'; }
    else if(ratio<=20){ b4=10; b4detalle='El canon representa el '+ratio.toFixed(1)+'% de las ventas promedio.'; b4brecha='Para el máximo, el canon debería representar el 10% o menos de las ventas promedio (hoy '+ratio.toFixed(1)+'%).'; }
    else { b4=4; b4detalle='El canon representa el '+ratio.toFixed(1)+'% de las ventas promedio.'; b4brecha='Para el máximo, el canon debería representar el 10% o menos de las ventas promedio (hoy '+ratio.toFixed(1)+'%).'; }
  }
  blocks.push({nombre:'Cobertura de cuota (canon vs. ventas)', pts:b4, max:15, detalle:b4detalle, brecha:b4brecha});

  let b5=0,b5detalle='',b5brecha='';
  const cc=d.constanciaCuit;
  if(!cc){ b5=0; b5detalle='Falta la constancia de CUIT / regularidad societaria.'; b5brecha='Cargá la constancia de CUIT/regularidad societaria para poder puntuar este bloque.'; }
  else if(!cc.impuestos_con_deuda_o_incumplimiento && String(cc.estado_clave||'').toLowerCase().includes('activ')){ b5=15; b5detalle='Constancia activa, inscripción al día, sin deudas previsionales/fiscales.'; }
  else { b5=8; b5detalle='Regularidad formal con observaciones menores.'; b5brecha='Para el máximo, hay que resolver las observaciones fiscales/previsionales pendientes.'; }
  blocks.push({nombre:'Regularidad societaria', pts:b5, max:15, detalle:b5detalle, brecha:b5brecha});

  return finalizeRiesgoScore(blocks, redFlags, 'PJ', d.cac);
}
function finalizeRiesgoScore(blocks, redFlags, tipo, cac){
  const puntajeBase = blocks.reduce((s,b)=>s+b.pts,0);
  // CAC (Conozca a su Cliente): suma hasta 5 puntos, sin pasar nunca de 100.
  // No anula las banderas rojas (si hay alguna, igual queda en rojo).
  const cacActivo = !!cac;
  const cacBonus = cacActivo ? Math.min(5, Math.max(0, 100-puntajeBase)) : 0;
  const puntaje = puntajeBase + cacBonus;
  let semaforo;
  if(redFlags.length>0) semaforo='ROJO';
  else if(puntaje>=66) semaforo='VERDE';
  else if(puntaje>=31) semaforo='AMARILLO';
  else semaforo='ROJO';
  const mitigantes=[];
  if(semaforo==='AMARILLO'){
    blocks.forEach(b=>{
      const pct = b.max ? b.pts/b.max : 1;
      if(pct<0.6){
        if(/[Cc]apacidad de pago|[Cc]obertura/.test(b.nombre)) mitigantes.push('Pedir incremento del Canon Inicial (down payment) del 10% al 20%.');
        if(/Veraz/.test(b.nombre)) mitigantes.push('Solicitar fianza personal del socio mayoritario o garante adicional.');
        if(/[Bb]alance/.test(b.nombre)) mitigantes.push('Solicitar garantías adicionales dado el nivel de apalancamiento.');
        if(/ingresos|[Rr]espaldo/.test(b.nombre)) mitigantes.push('Solicitar documentación de respaldo adicional de ingresos.');
        if(/[Rr]egularidad/.test(b.nombre)) mitigantes.push('Solicitar regularización de la situación fiscal/previsional antes de aprobar.');
      }
    });
    if(mitigantes.length===0) mitigantes.push('Evaluar mayor Canon Inicial o garantías adicionales antes de aprobar.');
  }
  return {tipo, puntaje, puntajeBase, cacActivo, cacBonus, semaforo, blocks, redFlags, mitigantes:Array.from(new Set(mitigantes))};
}
// arma los "datos clave" a destacar (Veraz/Nosis, resultado del balance,
// tendencia de ventas, etc.) — se usa tanto en el panel web como en el PDF
function buildDatosClave(datos, tipoPersona){
  const items = [];
  if(datos.veraz){
    const situ = datos.veraz.situacion_bcra;
    items.push({
      label:'Situación BCRA (Veraz/Nosis)',
      valor: situ!=null ? ('Situación '+situ) : 'Sin dato',
      alerta: situ!=null && situ>=3,
    });
    if(datos.veraz.deuda_total_informada){
      items.push({label:'Deuda total informada', valor:money(Number(datos.veraz.deuda_total_informada)), alerta:false});
    }
    if(datos.veraz.cheques_rechazados){
      items.push({label:'Cheques rechazados', valor: datos.veraz.cheques_rechazados_regularizados ? 'Sí (regularizados)' : 'Sí (sin regularizar)', alerta: !datos.veraz.cheques_rechazados_regularizados});
    }
  }
  if(datos.balance){
    const g = Number(datos.balance.ganancia_ejercicio);
    if(!isNaN(g)){
      items.push({label:'Resultado del ejercicio', valor: (g>=0?'Ganancia de ':'Pérdida de ')+money(Math.abs(g)), alerta: g<0});
    }
    const pn = Number(datos.balance.patrimonio_neto);
    if(!isNaN(pn)){
      items.push({label:'Patrimonio Neto', valor: money(pn), alerta: pn<0});
    }
    const pn2=Number(datos.balance.patrimonio_neto), pas=Number(datos.balance.pasivo_total);
    if(!isNaN(pn2) && pn2>0 && !isNaN(pas)){
      items.push({label:'Apalancamiento (Pasivo/PN)', valor: (pas/pn2).toFixed(2)+'x', alerta: (pas/pn2)>4});
    }
  }
  if(tipoPersona==='PJ'){
    const ddjjs=(datos.ddjjIva||[]).filter(Boolean).slice().sort((a,b)=>String(a.periodo||'').localeCompare(String(b.periodo||'')));
    if(ddjjs.length>=2){
      const first=ddjjs[0].ventas_gravadas||0, last=ddjjs[ddjjs.length-1].ventas_gravadas||0;
      const variacion = first>0 ? ((last-first)/first*100) : 0;
      items.push({label:'Tendencia de ventas', valor:(variacion>=0?'+':'')+variacion.toFixed(1)+'%', alerta: variacion<-10});
    }
  }
  const totalCanon = sumCanones(datos);
  if(totalCanon){
    items.push({label:'Canon mensual total', valor: money(totalCanon), alerta:false});
  }
  if(datos.constanciaCuit){
    items.push({label:'Situación fiscal (CUIT/AFIP)', valor: datos.constanciaCuit.impuestos_con_deuda_o_incumplimiento ? 'Con observaciones' : 'Regular', alerta: !!datos.constanciaCuit.impuestos_con_deuda_o_incumplimiento});
  }
  return items;
}
function computeRiesgoActual(){
  return state.riesgoTipoPersona==='PF' ? scorePF(state.riesgoDatos) : scorePJ(state.riesgoDatos);
}

// ---------- eventos de guardado ----------
async function handleGuardarEvaluacion(){
  if(!state.riesgoNombre.trim()){ state.error='Ponele un nombre a la persona o empresa evaluada.'; render(); return; }
  const resultado = computeRiesgoActual();
  state.riesgoEvaluacionesLoading = true; render();
  try{
    await saveRiesgoEvaluacion({ tipo: state.riesgoTipoPersona, nombre: state.riesgoNombre.trim(), datos: state.riesgoDatos, resultado });
    state.notice = 'Evaluación guardada: '+state.riesgoNombre+' — '+resultado.semaforo+' ('+resultado.puntaje+' pts).';
    state.riesgoEvaluacionesLoaded = false;
    resetRiesgoForm();
    state.riesgoView='guardadas';
    await loadRiesgoEvaluaciones();
  } catch(e){ state.error=(e&&e.message)||'No pude guardar la evaluación.'; }
  finally{ state.riesgoEvaluacionesLoading=false; render(); }
}
function resetRiesgoForm(){
  state.riesgoNombre=''; state.riesgoDocEstados={}; state.riesgoDocErrores={};
  state.riesgoDatos={ canones:[{descripcion:'',monto:''}], regimenIngreso:'dependencia', antiguedadAnios:'',
    veraz:null, balance:null, ddjjIva:[null,null,null], reciboSueldo:null, monotributo:null,
    ddjjGanancias:null, constanciaCuit:null, cac:false };
  riesgoPendingFiles = {};
}
// suma todos los cánones cargados (para operaciones con varias unidades/leasings
// juntos); si una evaluación vieja solo tenía el campo único, lo sigue leyendo igual
function sumCanones(d){
  if(Array.isArray(d.canones) && d.canones.length){
    return d.canones.reduce((s,c)=> s + (Number(c.monto)||0), 0);
  }
  return Number(d.canonMensualLeasing)||0;
}

// ---------- vista: Transcol / Matriz de Evaluación de Riesgo ----------
function buildTranscol(){
  let html = '<div style="max-width:1000px;margin:0 auto;">';
  if(state.error) html += '<div class="banner error">⚠ '+esc(state.error)+'</div>';
  if(state.notice) html += '<div class="banner notice">✓ '+esc(state.notice)+'</div>';
  html += state.riesgoView==='nueva' ? buildRiesgoNueva() : state.riesgoView==='contratos' ? buildContratos() : state.riesgoView==='generador' ? buildGenerador() : buildRiesgoGuardadas();
  html += '</div></main>';
  return html;
}

      '<span class="semaforo-badge '+resultado.semaforo+'">'+
        (resultado.semaforo==='VERDE'?'🟢 VERDE — APTO DIRECTO':resultado.semaforo==='AMARILLO'?'🟡 AMARILLO — APTO CON PRECAUCIONES':'🔴 ROJO — INCOMPATIBLE')+
      '</span>'+
      '<div style="flex:1;min-width:200px;">'+
        '<div class="score-bar-track"><div class="score-bar-fill '+resultado.semaforo+'" style="width:'+resultado.puntaje+'%;"></div></div>'+
        '<div class="font-num" style="font-size:13px;margin-top:4px;">'+resultado.puntaje.toFixed(0)+' / 100 puntos</div>'+
      '</div>'+
    '</div>';

  if(resultado.redFlags.length){
    html += '<div class="banner error"><b>Banderas rojas:</b><ul style="margin:4px 0 0 18px;padding:0;">'+
      resultado.redFlags.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul></div>';
  }

  if(resultado.cacActivo){
    html += '<div class="banner info" style="margin-bottom:8px;">🤝 <span><b>CAC (Conozca a su Cliente) aplicado:</b> puntaje por bloques '+resultado.puntajeBase+' + bonificación '+
      (resultado.cacBonus>0 ? '+'+resultado.cacBonus : '0 (ya estaba en 100)')+(resultado.cacBonus>0 && resultado.cacBonus<5 ? ' (tope de 100)' : '')+' = <b>'+resultado.puntaje+'</b>.'+
      (resultado.redFlags.length ? ' El CAC no anula las banderas rojas: el resultado sigue en rojo.' : '')+'</span></div>';
  }
  const datosClave = datos ? buildDatosClave(datos, tipoPersona) : [];
  if(datosClave.length){

      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:8px;">'+

        '<div class="font-num" style="font-size:14px;font-weight:600;margin-top:2px;'+(k.alerta?'color:#be123c;':'')+'">'+esc(k.valor)+'</div>'+
      '</div>').join('')+

  html += '</div>';

// recalcula el resultado completo de una evaluación guardada a partir de los
// datos originales (así no hace falta guardar el detalle por bloque aparte:
// siempre se recalcula igual, en vivo)
function resultadoDeRegistro(ev){
  return ev.tipo_persona==='PF' ? scorePF(ev.datos||{}) : scorePJ(ev.datos||{});
}

// arma un gráfico de barras (puntaje obtenido vs. máximo posible por bloque)
// como imagen, para insertarlo en el PDF
function buildScoreChartImage(resultado){
  return new Promise((resolve)=>{
    const canvas = document.createElement('canvas');
    canvas.width = 900; canvas.height = 380;
    const labels = resultado.blocks.map(b=> b.nombre.length>32 ? b.nombre.slice(0,30)+'…' : b.nombre);
    const maxEje = Math.max(...resultado.blocks.map(b=>b.max)) + 5;
    const chart = new Chart(canvas, {
      type:'bar',
      data:{ labels, datasets:[
        {label:'Puntaje obtenido', data:resultado.blocks.map(b=>b.pts), backgroundColor:'#0A70A1'},
        {label:'Máximo posible', data:resultado.blocks.map(b=>b.max), backgroundColor:'#cbd5e1'},
      ]},
      options:{
        indexAxis:'y', responsive:false, animation:false,
        plugins:{legend:{position:'bottom', labels:{font:{size:13}}}},
        scales:{ x:{beginAtZero:true, max:maxEje, ticks:{font:{size:12}}}, y:{ticks:{font:{size:12}}} }
      }
    });
    setTimeout(()=>{
      let img = null;
      try{ img = canvas.toDataURL('image/png'); }catch(e){}
      chart.destroy();
      resolve(img);
    }, 200);
  });
}

async function exportEvaluacionPDF(nombre, tipoPersona, resultado, datos){
  if(!window.jspdf || !window.autoTable){ state.error='La librería de PDF todavía no cargó, esperá un segundo y volvé a intentar.'; render(); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageWidth = doc.internal.pageSize.getWidth();
  let y = 0;

  doc.setFillColor(6,48,74);
  doc.rect(0,0,pageWidth,70,'F');
  try{
    const logoW = 140, logoH = logoW*(158/476);
    doc.addImage('data:image/png;base64,'+TRANSCOL_LOGO_B64, 'PNG', 40, (70-logoH)/2, logoW, logoH);
  }catch(e){ /* si el logo falla, seguimos sin él */ }
  doc.setTextColor(255,255,255);
  doc.setFontSize(10.5); doc.setFont(undefined,'normal');
  doc.text('Informe de Evaluación de Riesgo Crediticio', pageWidth-40, 40, {align:'right'});
  y = 95;

  doc.setTextColor(15,23,42);
  doc.setFontSize(13); doc.setFont(undefined,'bold');
  doc.text(String(nombre), 40, y);
  doc.setFontSize(10); doc.setFont(undefined,'normal');
  doc.text('Tipo: '+(tipoPersona==='PF'?'Persona Física':'Persona Jurídica')+'   ·   Fecha: '+new Date().toLocaleDateString('es-AR'), 40, y+16);
  y += 40;

  const colores = {VERDE:[34,197,94], AMARILLO:[234,179,8], ROJO:[239,68,68]};
  const c = colores[resultado.semaforo] || colores.ROJO;
  doc.setFillColor(c[0],c[1],c[2]);
  doc.roundedRect(40, y, 260, 34, 6, 6, 'F');
  doc.setTextColor(255,255,255); doc.setFontSize(12); doc.setFont(undefined,'bold');
  const etiqueta = resultado.semaforo==='VERDE' ? 'VERDE — APTO DIRECTO' : resultado.semaforo==='AMARILLO' ? 'AMARILLO — APTO CON PRECAUCIONES' : 'ROJO — INCOMPATIBLE';
  doc.text(etiqueta, 50, y+22);
  doc.setTextColor(15,23,42); doc.setFontSize(20); doc.setFont(undefined,'bold');
  doc.text(resultado.puntaje.toFixed(0)+' / 100', 320, y+24);
  if(resultado.cacActivo){
    doc.setFontSize(8.5); doc.setFont(undefined,'normal'); doc.setTextColor(71,85,105);
    doc.text('Incluye bonificación CAC (Conozca a su Cliente): '+(resultado.cacBonus>0?'+'+resultado.cacBonus:'+0')+' pts. Puntaje por bloques: '+resultado.puntajeBase+'.'+(resultado.redFlags.length?' El CAC no anula las banderas rojas.':''), 40, y+48);
    y += 14;
  }
  y += 55;

  function chequearSalto(altoNecesario){
    if(y + altoNecesario > 780){ doc.addPage(); y = 40; }
  }

  // ---- datos clave destacados ----
  const datosClave = datos ? buildDatosClave(datos, tipoPersona) : [];
  if(datosClave.length){
    chequearSalto(90);
    doc.setFontSize(11); doc.setTextColor(6,48,74); doc.setFont(undefined,'bold');
    doc.text('Datos clave', 40, y);
    y += 12;
    const cols = 3, gap = 10;
    const boxW = (515 - (cols-1)*gap) / cols;
    const boxH = 40;
    datosClave.forEach((k,i)=>{
      const col = i % cols, fila = Math.floor(i/cols);
      const bx = 40 + col*(boxW+gap);
      const by = y + fila*(boxH+gap);
      if(k.alerta) doc.setFillColor(254,242,242); else doc.setFillColor(241,245,249);
      doc.roundedRect(bx, by, boxW, boxH, 4, 4, 'F');
      doc.setFontSize(7); doc.setFont(undefined,'normal');
      if(k.alerta) doc.setTextColor(190,18,60); else doc.setTextColor(100,116,139);
      doc.text(String(k.label).toUpperCase(), bx+8, by+14, {maxWidth:boxW-16});
      doc.setFontSize(10.5); doc.setFont(undefined,'bold');
      if(k.alerta) doc.setTextColor(190,18,60); else doc.setTextColor(15,23,42);
      doc.text(String(k.valor), bx+8, by+30, {maxWidth:boxW-16});
    });
    const filas = Math.ceil(datosClave.length/cols);
    y += filas*(boxH+gap) + 10;
  }

  // ---- gráfico de barras por bloque ----
  chequearSalto(240);
  try{
    const img = await buildScoreChartImage(resultado);
    if(img){ doc.addImage(img, 'PNG', 40, y, 515, 217); y += 232; }
  } catch(e){ /* si falla el gráfico, seguimos sin él */ }

  // ---- tabla de detalle por bloque, con la brecha al máximo cuando corresponde ----
  window.autoTable(doc, {
    startY: y,
    head: [['Bloque','Puntaje','Detalle']],
    body: resultado.blocks.map(b=>[
      b.nombre,
      b.pts+' / '+b.max,
      b.detalle + (b.pts<b.max && b.brecha ? (/^Para el máximo,/i.test(b.brecha) ? '\nPara llegar al máximo: '+b.brecha.replace(/^Para el máximo,\s*/i,'') : '\nPara llegar al máximo: '+b.brecha) : ''),
    ]).concat(resultado.cacActivo ? [['Bonificación CAC (Conozca a su Cliente)', '+'+resultado.cacBonus, 'Cliente de la casa. Suma hasta 5 puntos, con tope de 100.']] : []),
    styles:{fontSize:9, cellPadding:5},
    headStyles:{fillColor:[10,112,161], textColor:255},
    columnStyles:{0:{cellWidth:130}, 1:{cellWidth:50}, 2:{cellWidth:'auto'}},
    didParseCell: function(data){
      if(data.section==='body' && data.column.index===2 && String(data.cell.raw).includes('Para llegar al máximo')){
        data.cell.styles.textColor = [15,23,42];
      }
    },
    margin:{left:40, right:40},
  });
  y = doc.lastAutoTable.finalY + 20;

  if(resultado.redFlags.length){
    const alto = 22 + resultado.redFlags.length*14;
    chequearSalto(alto+15);
    doc.setFillColor(254,226,226);
    doc.roundedRect(40, y, 515, alto, 4, 4, 'F');
    doc.setTextColor(153,27,27); doc.setFontSize(10); doc.setFont(undefined,'bold');
    doc.text('Banderas rojas', 50, y+16);
    doc.setFont(undefined,'normal'); doc.setFontSize(9);
    resultado.redFlags.forEach((f,i)=> doc.text('• '+String(f), 50, y+16+(i+1)*14, {maxWidth:495}));
    y += alto + 15;
  }

  if(resultado.semaforo==='AMARILLO' && resultado.mitigantes.length){
    const alto = 22 + resultado.mitigantes.length*14;
    chequearSalto(alto+15);
    doc.setFillColor(255,251,235);
    doc.roundedRect(40, y, 515, alto, 4, 4, 'F');
    doc.setTextColor(133,77,14); doc.setFontSize(10); doc.setFont(undefined,'bold');
    doc.text('Mitigantes sugeridos', 50, y+16);
    doc.setFont(undefined,'normal'); doc.setFontSize(9);
    resultado.mitigantes.forEach((m,i)=> doc.text('• '+String(m), 50, y+16+(i+1)*14, {maxWidth:495}));
    y += alto + 15;
  }

  doc.setFontSize(8); doc.setTextColor(148,163,184);
  doc.text('Generado automáticamente por el sistema de evaluación de riesgo de Transcol S.A. — '+new Date().toLocaleString('es-AR'), 40, 820);

  const nombreArchivo = 'Legajo_'+String(nombre).replace(/[^A-Za-z0-9]+/g,'_').slice(0,60)+'.pdf';
  doc.save(nombreArchivo);
}

// ============================================================
// TRANSCOL — Agenda de contratos
// ============================================================
function fmtDateISO(s){
  const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (m[3]+'/'+m[2]+'/'+m[1]) : '—';
}
function parseDateISOLocal(s){
  const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(Number(m[1]), Number(m[2])-1, Number(m[3])) : null;
}
function contratoEstado(c){
  const fin = parseDateISOLocal(c.fecha_fin);
  if(!fin) return {txt:'Sin fecha de fin', color:'#64748b', bg:'#f1f5f9'};
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const dias = Math.round((fin.getTime()-hoy.getTime())/86400000);
  if(dias<0) return {txt:'Finalizado', color:'#475569', bg:'#e2e8f0'};
  if(dias<=90) return {txt:'Vence en '+dias+' día'+(dias===1?'':'s'), color:'#854d0e', bg:'#fef9c3'};
  return {txt:'Vigente', color:'#166534', bg:'#dcfce7'};
}
function formatTasaContrato(c){
  const n = c.tasa_interes==null ? null : Number(c.tasa_interes);
  const nTxt = (n==null || isNaN(n)) ? '—' : (String(n).replace('.',',')+'%');
  if(c.tipo_tasa==='Variable') return (c.tasa_base||'Variable')+' + '+nTxt;
  return 'Fija '+nTxt;
}
function validarContrato(f){
  if(!String(f.cliente||'').trim()) return 'Completá el nombre del cliente.';
  if(f.fechaInicio && f.fechaFin && f.fechaFin < f.fechaInicio) return 'La fecha de finalización no puede ser anterior a la de inicio.';
  if(f.cuotas!=='' && (isNaN(Number(f.cuotas)) || Number(f.cuotas)<=0)) return 'La cantidad de cuotas tiene que ser un número mayor a 0.';
  if(f.anio!=='' && (isNaN(Number(f.anio)) || Number(f.anio)<1900 || Number(f.anio)>2100)) return 'El año del vehículo no parece correcto.';
  return '';
}
function contratoToPayload(f){
  const num = v => (v===''||v==null||isNaN(Number(v))) ? null : Number(v);
  return {
    cliente: String(f.cliente).trim(),
    veh_marca: String(f.marca||'').trim() || null,
    veh_modelo: String(f.modelo||'').trim() || null,
    veh_anio: num(f.anio),
    veh_dominio: String(f.dominio||'').trim().toUpperCase() || null,
    fecha_inicio: f.fechaInicio || null,
    fecha_fin: f.fechaFin || null,
    cuotas: num(f.cuotas),
    tipo_prestamo: f.tipoPrestamo,
    tipo_tasa: f.tipoTasa,

async function handleGuardarContrato(){

  if(err){ state.error = err; state.notice=''; render(); return; }
  state.error=''; state.contratosLoading = true; render();
  try{

    let res;
    if(state.contratoEditId){ res = await sb.from('contratos_transcol').update(payload).eq('id', state.contratoEditId); }
    else { res = await sb.from('contratos_transcol').insert(payload); }

  ws.columns = [{width:30},{width:14},{width:16},{width:8},{width:12},{width:12},{width:12},{width:8},{width:16},{width:12},{width:16},{width:12},{width:18}];
  heads.forEach((h,i)=>{
    const cell = ws.getCell(1,i+1);
    cell.value = h; cell.font = {bold:true, color:{argb:'FFFFFFFF'}};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF0A70A1'}};
    cell.border = thinBorderAll();
  });
  lista.forEach((c,idx)=>{
    const r = idx+2;
    const vals = [c.cliente, c.veh_marca||'', c.veh_modelo||'', c.veh_anio==null?'':c.veh_anio, c.veh_dominio||'',
      fmtDateISO(c.fecha_inicio), fmtDateISO(c.fecha_fin), c.cuotas==null?'':c.cuotas, c.tipo_prestamo||'', c.tipo_tasa||'',
      c.tipo_tasa==='Variable' ? (c.tasa_base||'') : '', c.tasa_interes==null?'':Number(c.tasa_interes), contratoEstado(c).txt];
    vals.forEach((v,i)=>{ const cell = ws.getCell(r,i+1); cell.value = v; cell.border = thinBorderAll(); });
  });
  const buf = await wb.xlsx.writeBuffer();
  downloadBlob(buf, 'Contratos_Transcol_'+todayISO()+'.xlsx');
}

function renderChat(){

let cachedSpanishVoice = null;
function pickSpanishVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  if(!voices.length) return null;
  const esVoices = voices.filter(v=>/^es/i.test(v.lang));
  if(!esVoices.length) return null;
  // preferimos voces conocidas por sonar más naturales (no robotizadas), y
  // dentro de esas, las de español rioplatense/argentino si están disponibles
  const byName = esVoices.find(v=>/google/i.test(v.name)) ||
                 esVoices.find(v=>/natural|paulina|monica|mónica|helena|lucia|lucía|elena|esperanza/i.test(v.name));
  const byLangAR = esVoices.find(v=>/es-AR/i.test(v.lang));
  return byName || byLangAR || esVoices[0];
}
// evita que la síntesis de voz lea "$" como "dólares": lo convertimos a la
// palabra "pesos" antes de hablarlo (el texto que se ve en pantalla no cambia)
function toSpeechText(text){
  return text.replace(/\$\s*(\d+(?:\.\d+)*)/g, '$1 pesos');
}
function speakText(text){
  if(!state.chatVoiceOn) return;
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(toSpeechText(text));
    u.lang = 'es-AR';
    const voice = pickSpanishVoice();
    if(voice) u.voice = voice;
    u.rate = 0.98;
    u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  }catch(e){ /* si el navegador no puede hablar, no pasa nada */ }
}

function handleChatSend(overrideText){
  const inputEl = document.getElementById('chat-input');
  const text = (overrideText!=null ? overrideText : (inputEl?inputEl.value:'')).trim();
  if(!text) return;
  state.chatMessages.push({role:'user', text});
  const answer = generateAnswer(text);
  if(answer.clientKey) state.chatLastClientKey = answer.clientKey;
  state.chatMessages.push({role:'bot', text:answer.text});
  renderChat();
  speakText(answer.text);
}

function toggleChatMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  if(state.chatListening){
    if(speechRecognizer) speechRecognizer.stop();
    return;
  }
  speechRecognizer = new SR();
  speechRecognizer.lang = 'es-AR';
  speechRecognizer.interimResults = false;
  speechRecognizer.maxAlternatives = 1;
  speechRecognizer.onstart = ()=>{ state.chatListening = true; renderChat(); };
  speechRecognizer.onerror = ()=>{ state.chatListening = false; renderChat(); };
  speechRecognizer.onend = ()=>{ state.chatListening = false; renderChat(); };
  speechRecognizer.onresult = (e)=>{
    const transcript = e.results[0][0].transcript;
    handleChatSend(transcript);
  };
  try{ speechRecognizer.start(); }catch(e){ state.chatListening=false; renderChat(); }
}

    else if((state.riesgoView==='contratos' || state.riesgoView==='generador') && !state.contratosLoaded){ loadContratos(); }
    else { render(); }
  } else if(action==='riesgo-tipo'){ state.riesgoTipoPersona = btn.dataset.tipo; render();
  } else if(action==='riesgo-analizar'){
    const doc = btn.dataset.doc;
    const file = riesgoPendingFiles[doc];
    if(!file){ state.error='Elegí primero el archivo PDF de "'+ (RIESGO_DOC_LABELS[doc]||doc) +'".'; render(); return; }
    state.error='';
    analizarDocumentoIA(doc, file);
  } else if(action==='riesgo-guardar'){ handleGuardarEvaluacion();
  } else if(action==='riesgo-cancelar'){ resetRiesgoForm(); state.error=''; state.notice=''; render();
  } else if(action==='contrato-guardar'){ handleGuardarContrato();
  } else if(action==='contrato-cancelar'){ resetContratoForm(); state.error=''; state.notice=''; render();
  } else if(action==='contrato-editar'){ editarContrato(btn.dataset.id);
  } else if(action==='contrato-borrar'){ borrarContrato(btn.dataset.id);
  } else if(action==='contratos-excel'){ exportContratosExcel();
  } else if(action==='riesgo-canon-agregar'){ state.riesgoDatos.canones.push({descripcion:'',monto:''}); render();
  } else if(action==='riesgo-canon-quitar'){
    const i = Number(btn.dataset.idx);
    state.riesgoDatos.canones.splice(i,1);
    if(state.riesgoDatos.canones.length===0) state.riesgoDatos.canones.push({descripcion:'',monto:''});
    render();
  } else if(action==='riesgo-pdf'){
    exportEvaluacionPDF(state.riesgoNombre||'Sin nombre', state.riesgoTipoPersona, computeRiesgoActual(), state.riesgoDatos);
  } else if(action==='riesgo-pdf-guardado'){
    const idx = Number(btn.dataset.idx);
    const ev = state.riesgoEvaluaciones[idx];
    if(ev) exportEvaluacionPDF(ev.nombre, ev.tipo_persona, resultadoDeRegistro(ev), ev.datos);
  }
}
function onRootInput(e){
  if(cgOnInput(e)) return;
  if(e.target.id==='search-input'){ state.search = e.target.value; refreshDashboardList(); }
  else if(e.target.id==='cutoff-date'){ state.cutoffDate = e.target.value; }
  else if(e.target.id==='deudores-file'){ state.deudoresFile = e.target.files[0]||null; render(); }
  else if(e.target.id==='recibos-file'){ state.recibosFile = e.target.files[0]||null; render(); }
  else if(e.target.id==='plancuotas-file'){ state.planCuotasFile = e.target.files[0]||null; }
  else if(e.target.id==='plancuotas-grupo'){ state.planCuotasEditGrupo = e.target.value; }
  else if(e.target.id==='plancuotas-cuotas'){ state.planCuotasEditCuotas = e.target.value; }
  else if(e.target.id==='min-cuotas-input'){ state.minCuotasAdeudadas = e.target.value; refreshFilteredView(); }
  else if(e.target.classList.contains('presupuesto-cell')){
    const mes = e.target.dataset.mes, concept = e.target.dataset.concept;
    const val = parseFloat(e.target.value) || 0;
    if(!state.presupuestoData.has(mes)) state.presupuestoData.set(mes, emptyPresupuestoRow());
    state.presupuestoData.get(mes)[concept] = val;
    state.presupuestoDirtyMonths.add(mes);
    updatePresupuestoSaveButton();
  }
  else if(e.target.classList.contains('riesgo-doc-file')){
    riesgoPendingFiles[e.target.dataset.doc] = e.target.files[0] || null;
    // solo actualizamos el nombre mostrado, sin re-renderizar todo (así no
    // se resetea ningún otro campo mientras el usuario sigue completando el formulario)
    const label = e.target.parentElement ? e.target.parentElement.querySelector('.doc-filename') : null;
    if(label) label.textContent = e.target.files[0] ? ('📎 '+e.target.files[0].name) : '';
  }
  else if(e.target.classList.contains('contrato-field')){
    const f = e.target.dataset.field;
    let v = e.target.value;
    if(f==='dominio'){ v = v.toUpperCase(); if(e.target.value!==v) e.target.value = v; }
    state.contratoForm[f] = v;
  }
  else if(e.target.id==='contratos-search'){ state.contratosSearch = e.target.value; refreshContratosList(); }
  else if(e.target.id==='riesgo-nombre'){ state.riesgoNombre = e.target.value; }
}
function updatePresupuestoSaveButton(){
  const btn = document.querySelector('[data-action="presupuesto-save"]');
  if(!btn) return;
  const n = state.presupuestoDirtyMonths.size;
  btn.disabled = n===0;
  btn.innerHTML = '💾 Guardar cambios'+(n>0?' ('+n+')':'');
}
function onRootChange(e){
  if(cgOnChange(e)) return;
  if(e.target.id==='sort-field'){ state.sortField = e.target.value; refreshDashboardList(); }
  else if(e.target.classList.contains('estado-check')){ toggleSetItem(state.estadoFilter, e.target.value); refreshFilteredView(); }
  else if(e.target.classList.contains('gerencia-check')){ toggleSetItem(state.gerenciaFilter, e.target.value); refreshFilteredView(); }
  else if(e.target.id==='track-client-select'){
    state.trackClientKey = e.target.value;
    if(e.target.value) loadTrackHistory(e.target.value);
    else { state.trackHistoryRaw=[]; render(); }
  }
  else if(e.target.id==='informe-gerencia-select'){ state.informeGerencia = e.target.value; state.notice=''; state.error=''; render();
  } else if(e.target.classList.contains('mora-serie-check')){
    const serie = e.target.dataset.serie;
    const otra = serie==='impago' ? 'precancelable' : 'impago';
    if(!e.target.checked && !state.moraSeriesVisible[otra]){ e.target.checked = true; return; } // siempre queda al menos una línea
    state.moraSeriesVisible[serie] = e.target.checked;
    drawGeneralChart();
  } else if(e.target.classList.contains('presupuesto-concept-check')){
    toggleSetItem(state.presupuestoVisibleConcepts, e.target.value);
    drawPresupuestoChart();
  }
  else if(e.target.classList.contains('contrato-field') && e.target.dataset.field==='tipoTasa'){ state.contratoForm.tipoTasa = e.target.value; render(); }
  else if(e.target.id==='riesgo-cac'){ state.riesgoDatos.cac = e.target.checked; render(); }
  else if(e.target.id==='riesgo-regimen'){ state.riesgoDatos.regimenIngreso = e.target.value; render(); }
  else if(e.target.id==='riesgo-antiguedad'){ state.riesgoDatos.antiguedadAnios = e.target.value; render(); }
  else if(e.target.classList.contains('riesgo-canon-desc')){
    const i = Number(e.target.dataset.idx); if(state.riesgoDatos.canones[i]) state.riesgoDatos.canones[i].descripcion = e.target.value; render();
  }
  else if(e.target.classList.contains('riesgo-canon-monto')){
    const i = Number(e.target.dataset.idx); if(state.riesgoDatos.canones[i]) state.riesgoDatos.canones[i].monto = e.target.value; render();
  }
}
// aplica el cambio de filtro a la pestaña que esté abierta en ese momento;
// mora general y por cliente ya tienen los datos descargados, así que
// recalculan al instante sin volver a pedirle nada a la base
function refreshFilteredView(){
  if(state.view==='dashboard') refreshDashboardList();
  else render();
}
function refreshDashboardList(){
  const listEl = document.getElementById('client-list');
  if(!listEl) return;
  const filtered = getFilteredClients();
  listEl.innerHTML = renderClientListInner(filtered);
  const sortBtn = document.getElementById('sort-dir-btn');
  if(sortBtn) sortBtn.textContent = state.sortDir==='desc' ? '↓ Mayor a menor' : '↑ Menor a mayor';
  // refresh the 4 stat cards without touching the filter bar / search focus
  const totalImpago = filtered.reduce((s,c)=>s+c.totalImpago,0);
  const totalPrecancelable = filtered.reduce((s,c)=>s+c.totalPrecancelable,0);
  const totalContratos = filtered.reduce((s,c)=>s+c.contractsFiltered.length,0);
  let prevTotalImpago = null;
  if(state.prevSnapshot) prevTotalImpago = filtered.reduce((s,c)=>{ const p=clientPrevImpago(c.key); return s+(p==null?0:p); },0);
  const grid = document.querySelector('.grid-4');
  if(grid){
    grid.innerHTML = statCard('Clientes (filtro actual)', filtered.length, 'slate')+
      statCard('Contratos (filtro actual)', totalContratos, 'slate')+
      statCard('Deuda vencida (impaga)', money(totalImpago), 'rose', deltaChipHtml(totalImpago, prevTotalImpago))+
      statCard('A vencer (precancelable)', money(totalPrecancelable), 'slate');
  }
}

// ---------- boot ----------
(async function init(){
  attachEvents(); // activo la escucha de clics/teclas desde el arranque, así el
                   // botón "Entrar" de la contraseña funciona sin esperar a estar logueado
  state.configOk = configLooksValid();
  if(!state.configOk){ state.booting=false; render(); return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  state.authed = APP_PASSWORD ? (localStorage.getItem('morosidad_auth')==='ok') : true;
  try{
    state.snapshotDates = await listSnapshotDates();
    state.dbOk = true;
    if(state.authed){ await loadLatestSnapshotIntoView(); }
  } catch(e){
    state.dbOk = false;
  }
  state.booting = false;
  render();
})();
</script>
